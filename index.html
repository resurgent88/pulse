<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pulse">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<script>
/* ============================================================
   Pulse accounts — for Pulse on a site of its own (not the Claude artifact).
   Sign-in is Firebase Authentication (email and password). What syncs is what always did: the supplement
   list, its check-offs, tags and settings, as documents in Cloud Firestore under users/<your id>/, which the
   database's rules let only you read or write. Health data is never sent: it stays in this browser.

   This runs before the page's own scripts and hands them three things:
   - window.PULSE_HOST: who is signed in, the ending every storage key in this browser gets for that account
     (so each account's copy, Health data included, is kept apart, and signed out is a copy of its own), and
     the account controls the page shows.
   - window.claude: a stand-in for the Claude data store the page's sync code was written for, backed by
     Firestore, so that code runs unchanged.
   - the sign-in dialog.
   Firebase itself is only loaded when someone is signed in or opens the dialog, so signed out (or offline)
   the page starts as fast as before and works from this browser alone.
   ============================================================ */
(() => {
  "use strict";
  // The project's public identifiers. Not secrets: what protects the data is the database's rules.
  const CONFIG = {
    apiKey: "AIzaSyCkhKBojNl26ehSTOgapK1zDbTblVYkdlo",
    authDomain: "pulse-a182a.firebaseapp.com",
    projectId: "pulse-a182a",
    storageBucket: "pulse-a182a.firebasestorage.app",
    messagingSenderId: "629162017651",
    appId: "1:629162017651:web:677b4bd7317e3c02a33b06",
  };
  const SDK = "https://www.gstatic.com/firebasejs/12.4.0/";
  const BASE = "pulse-health-v1", AUTH_KEY = "pulse-account", OUT_KEY = "pulse-account-out";
  const ls = {
    get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del: k => { try { localStorage.removeItem(k); } catch (e) {} },
    keys: () => { try { return Object.keys(localStorage); } catch (e) { return []; } },
  };

  /* Who was signed in when this browser last heard from Firebase. Kept here so the page knows whose copy to
     open the moment it starts, before Firebase has loaded (or with no connection at all). Firebase is still
     the one that decides: when it disagrees, the note is corrected and the page starts again (agree). */
  let me = null;
  try { me = JSON.parse(ls.get(AUTH_KEY) || "null"); } catch (e) {}
  if (!(me && typeof me.uid === "string" && /^[A-Za-z0-9_-]{1,128}$/.test(me.uid))) me = null;
  const nsOf = uid => uid ? "-u-" + uid : "";
  const remember = u => { if (u) ls.set(AUTH_KEY, JSON.stringify({uid: u.uid, email: u.email || ""})); else ls.del(AUTH_KEY); };

  /* ---- Firebase, loaded once, when it's first needed ---- */
  let fb = null;
  const loadFB = () => fb || (fb = (async () => {
    const [A, U, F] = await Promise.all([import(SDK + "firebase-app.js"), import(SDK + "firebase-auth.js"), import(SDK + "firebase-firestore.js")]);
    const app = A.initializeApp(CONFIG), auth = U.getAuth(app);
    const store = F.initializeFirestore(app, {ignoreUndefinedProperties: true});
    await auth.authStateReady();
    // signed out here while Firebase couldn't be reached: finish the job now
    if (ls.get(OUT_KEY)) { try { await U.signOut(auth); } catch (e) {} ls.del(OUT_KEY); }
    return {U, F, auth, store};
  })().catch(e => { fb = null; throw e; }));
  // Firebase and this browser's note agree on who's here; if not, the note is put right and the page starts over
  const agree = f => {
    const u = f.auth.currentUser;
    if ((u ? u.uid : null) === (me ? me.uid : null)) return true;
    // (at most once every few seconds, so a browser that can't keep the note never reloads in a loop)
    let last = 0; try { last = +sessionStorage.getItem("pulse-account-restart") || 0; } catch (e) {}
    if (Date.now() - last < 5000) return false;
    try { sessionStorage.setItem("pulse-account-restart", String(Date.now())); } catch (e) {}
    remember(u); location.reload(); return false;
  };
  // signed in or out in another tab of this browser: this one follows
  addEventListener("storage", e => { if (e.key === AUTH_KEY) location.reload(); });
  const ready = async () => { const f = await loadFB(); if (!agree(f)) throw {code: "unavailable", message: "signing in again"}; return f; };

  /* ---- the store the page's sync code talks to ----
     Same shape as the Claude store: doc(path) / collection(path), set (replace), update (merge), get, onSnapshot.
     Differences smoothed over here:
     - paths: "data/users/<id>/pulse…" becomes "users/<id>/pulse/main…", the layout the database's rules cover.
     - update merges recursively there; in Firestore that is set with merge (update would replace a nested map).
     - Firestore has no arrays inside arrays (a day's tick times, a recipe's ingredients): an inner array goes up
       wrapped as {"~a": [...]} and comes back unwrapped.
     - a write the SDK can't get through just waits; here it gives up after 20 seconds and reports "unavailable",
       so the page can say sync is paused and send it again later (the SDK still delivers it if it can: the
       writes are merges, so twice is harmless).
     - "permission denied" reads as the store turning the write away, which the page takes as: keep it in this browser.
     - only what the server has confirmed is handed on. Before Firestore has heard from the server (a slow start, no
       connection) it reports an empty copy "from cache"; the page would read that as "the account has nothing"
       and upload this browser's copy over the account's. So those are skipped, and the listener asks to be told
       when the same data becomes confirmed (includeMetadataChanges), or that moment would pass unseen. */
  const real = p => p.replace(/^data\/users\/([^/]+)\/pulse(?=\/|$)/, "users/$1/pulse/main");
  const enc = v => Array.isArray(v) ? v.map(x => Array.isArray(x) ? {"~a": enc(x)} : enc(x))
    : v && typeof v === "object" ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, enc(x)])) : v;
  const dec = v => Array.isArray(v) ? v.map(dec)
    : v && typeof v === "object" ? (Object.keys(v).length === 1 && Array.isArray(v["~a"]) ? v["~a"].map(dec) : Object.fromEntries(Object.entries(v).map(([k, x]) => [k, dec(x)]))) : v;
  const clean = v => enc(JSON.parse(JSON.stringify(v)));
  const fbErr = e => {
    if (e && typeof e.code === "string" && !/[-/]/.test(e.code) && e.message) return e;   // already in the page's terms
    const c = String(e && e.code || "").replace(/^.*\//, "");
    return {code: c === "permission-denied" || c === "unauthenticated" ? "invalid_argument" : c ? c.replace(/-/g, "_") : "unavailable", message: String(e && e.message || e)};
  };
  const within = (p, ms = 20000) => Promise.race([p, new Promise((_, no) => setTimeout(() => no({code: "unavailable", message: "no answer from the account service"}), ms))]);
  const run = async fn => {
    let f; try { f = await within(ready()); } catch (e) { throw fbErr(e); }
    try { return await within(fn(f)); } catch (e) { throw fbErr(e); }
  };
  // a subscription starts once Firebase is there; if it can't be reached, it's tried again when the browser is back online
  const listen = start => {
    let off = null, stopped = false, timer = null;
    const go = () => { if (stopped || off) return; clearTimeout(timer);
      ready().then(f => { if (!stopped && !off) off = start(f); }, () => { if (!stopped) timer = setTimeout(go, 30000); }); };
    addEventListener("online", go); go();
    return () => { stopped = true; clearTimeout(timer); removeEventListener("online", go); if (off) off(); };
  };
  const LIVE = {includeMetadataChanges: true};
  const snapOf = s => ({id: s.id, exists: s.exists(), data: () => s.exists() ? dec(s.data()) : undefined, metadata: s.metadata});
  const doc = path => ({id: path.split("/").pop(), path,
    get: () => run(async f => snapOf(await f.F.getDoc(f.F.doc(f.store, real(path))))),
    set: body => run(f => f.F.setDoc(f.F.doc(f.store, real(path)), clean(body))),
    update: body => run(f => f.F.setDoc(f.F.doc(f.store, real(path)), clean(body), {merge: true})),
    delete: () => run(f => f.F.deleteDoc(f.F.doc(f.store, real(path)))),
    onSnapshot: (next, err) => listen(f => f.F.onSnapshot(f.F.doc(f.store, real(path)), LIVE, s => { if (!s.metadata.fromCache) next(snapOf(s)); }, e => err && err(fbErr(e)))),
    collection: name => col(path + "/" + name)});
  const col = path => ({path, doc: id => doc(path + "/" + id),
    onSnapshot: (next, err) => listen(f => f.F.onSnapshot(f.F.collection(f.store, real(path)), LIVE, q => { if (!q.metadata.fromCache) next({docs: q.docs.map(snapOf), size: q.size, empty: q.empty, metadata: q.metadata}); }, e => err && err(fbErr(e))))});
  window.claude = {use: async name =>
    name === "user" ? {id: async () => me ? me.uid : null}
    : name === "db" ? (me ? {doc, collection: col} : null)
    : null};

  /* ---- signing in and out ----
     Each account, and "signed out", has its own copy in this browser. The first time an account is used here,
     what was already in this browser signed out moves into it, so nothing has to be uploaded or entered again:
     - a new account takes everything: Health data, settings, supplements, tags and check-offs.
     - an existing account takes the Health data and settings only. Its supplements, tags and check-offs come
       from the account, and the signed-out ones stay behind rather than being written over it.
     Moved, not copied, so signing out leaves none of it on view. */
  const keysUnder = prefix => ls.keys().filter(k => k === prefix || k.startsWith(prefix + "-"));
  function moveIn(uid, isNew) {
    const mine = BASE + nsOf(uid);
    if (keysUnder(mine).length) return;
    for (const k of keysUnder(BASE)) {
      if (k.startsWith(BASE + "-u-")) continue;                        // another account's copy
      if (!isNew && k.startsWith(BASE + "-tags")) continue;
      const v = ls.get(k); if (v == null) continue;
      ls.del(k); if (!ls.set(mine + k.slice(BASE.length), v)) ls.set(k, v);   // (no room: it stays where it was)
    }
  }
  function enter(user, isNew) { moveIn(user.uid, isNew); ls.del(OUT_KEY); remember(user); location.reload(); }
  async function signOut() {
    // gone from this browser's view at once, even with no connection; Firebase is told now, or the next time it loads
    ls.set(OUT_KEY, "1"); remember(null);
    try { const f = await within(loadFB(), 6000); await f.U.signOut(f.auth); ls.del(OUT_KEY); } catch (e) {}
    location.reload();
  }

  /* ---- the dialog ---- */
  const MSG = {
    "invalid-credential": "That email and password don't match an account.",
    "wrong-password": "That email and password don't match an account.",
    "user-not-found": "That email and password don't match an account.",
    "invalid-email": "That doesn't look like an email address.",
    "missing-password": "Enter your password.",
    "missing-email": "Enter your email address.",
    "email-already-in-use": "There's already an account with that email. Sign in instead.",
    "weak-password": "Choose a longer password: at least 6 characters.",
    "password-does-not-meet-requirements": "That password doesn't meet the requirements. Try a longer one, with letters and numbers.",
    "too-many-requests": "Too many tries. Wait a few minutes, then try again.",
    "network-request-failed": "Couldn't reach the account service. Check your connection and try again.",
    "user-disabled": "That account has been turned off.",
    "operation-not-allowed": "Signing in with email and a password isn't turned on for this site yet.",
    "unauthorized-domain": "This web address isn't allowed to sign in yet. It has to be added in the Firebase console.",
  };
  const say = e => MSG[String(e && e.code || "").replace(/^.*\//, "")] || (e && /import|fetch|module/i.test(String(e.message || e)) ? MSG["network-request-failed"] : "That didn't work. Try again in a moment.");
  let dlg = null, mode = "in";
  const $ = id => dlg.querySelector("#" + id);
  function draw() {
    const isNew = mode === "new";
    $("acTitle").textContent = isNew ? "Create your account" : "Sign in to Pulse";
    $("acWhy").textContent = isNew
      ? "Your supplements, tags, check-ins and settings are saved to your account and follow you to every device. What's in this browser moves into it. Health data stays in this browser."
      : "Your supplements, tags, check-ins and settings come from your account. Health data already in this browser moves into it here, and is never sent anywhere.";
    $("acPass").autocomplete = isNew ? "new-password" : "current-password";
    $("acGo").textContent = isNew ? "Create account" : "Sign in";
    $("acSwitch").textContent = isNew ? "I already have an account" : "Create an account";
    $("acForgot").hidden = isNew;
    note("");
  }
  function note(text, good) { const n = $("acNote"); n.hidden = !text; n.textContent = text; n.className = good ? "ac-ok" : "err"; }
  function busy(on) { for (const b of dlg.querySelectorAll("button, input")) b.disabled = on; if (on) $("acGo").textContent = "One moment…"; else draw.label(); }
  draw.label = () => { $("acGo").textContent = mode === "new" ? "Create account" : "Sign in"; };
  function open(start) {
    if (!dlg) {
      dlg = document.createElement("dialog"); dlg.className = "sheet acct"; dlg.setAttribute("aria-labelledby", "acTitle");
      dlg.innerHTML = `<div class="sheet-head"><h2 id="acTitle"></h2><button type="button" class="iconbtn" id="acClose" aria-label="Close" style="width:36px;height:36px;font-size:20px">×</button></div>
        <form class="sheet-body" id="acForm" novalidate>
          <p class="explain" id="acWhy" style="margin:0"></p>
          <label class="ac-f" for="acEmail"><span>Email</span><input type="email" id="acEmail" name="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required></label>
          <label class="ac-f" for="acPass"><span>Password</span><input type="password" id="acPass" name="password" autocomplete="current-password" required></label>
          <p id="acNote" class="err" role="status" hidden style="margin:0"></p>
          <div class="ac-row"><button type="button" class="linkbtn" id="acForgot" style="font-size:13px">Forgot your password?</button><button type="submit" class="btn primary" id="acGo"></button></div>
          <p style="margin:0;padding-top:12px;border-top:1px solid var(--line)"><button type="button" class="linkbtn" id="acSwitch" style="font-size:13.5px"></button></p>
        </form>`;
      document.body.appendChild(dlg);
      $("acClose").onclick = () => dlg.close();
      dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
      $("acSwitch").onclick = () => { mode = mode === "new" ? "in" : "new"; draw(); $("acPass").value = ""; $("acEmail").focus(); };
      $("acForgot").onclick = async () => {
        const email = $("acEmail").value.trim();
        if (!email) { note("Enter your email address first, then tap this again."); $("acEmail").focus(); return; }
        busy(true);
        try { const f = await loadFB(); await f.U.sendPasswordResetEmail(f.auth, email); busy(false); note("If there's an account for " + email + ", an email with a link to choose a new password is on its way.", true); }
        catch (e) { busy(false); note(say(e)); }
      };
      $("acForm").addEventListener("submit", async e => {
        e.preventDefault();
        const email = $("acEmail").value.trim(), pass = $("acPass").value;
        if (!email) { note(MSG["missing-email"]); $("acEmail").focus(); return; }
        if (!pass) { note(MSG["missing-password"]); $("acPass").focus(); return; }
        busy(true);
        try {
          const f = await loadFB(), isNew = mode === "new";
          const cred = isNew ? await f.U.createUserWithEmailAndPassword(f.auth, email, pass) : await f.U.signInWithEmailAndPassword(f.auth, email, pass);
          $("acGo").textContent = "Signed in";
          enter(cred.user, isNew);
        } catch (e2) { busy(false); note(say(e2)); if (/password|credential/.test(String(e2 && e2.code))) $("acPass").select(); }
      });
    }
    mode = start === "new" ? "new" : "in"; draw();
    if (typeof showSheet === "function") showSheet(dlg); else if (!dlg.open) dlg.showModal();
    $("acEmail").focus();
  }
  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest("[data-acct]"); if (!b) return;
    e.preventDefault();
    if (b.dataset.acct === "out") { b.disabled = true; b.textContent = "Signing out…"; signOut(); } else open(b.dataset.acct);
  });

  document.head.insertAdjacentHTML("beforeend", `<style>
dialog.sheet.acct{width:min(420px,calc(100vw - 24px))}
.acct .sheet-body{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.ac-f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
.ac-f input{font:inherit;font-size:16px;font-weight:400;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.ac-f input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ac-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.acct .err,.ac-ok{font-size:14px;font-weight:600}
.ac-ok{color:var(--good)}
.ac-line{margin-top:14px;font-size:14px;color:var(--text-sub)}
.ac-ver{margin:12px 0 0;font-size:12.5px;color:var(--text-sub)}
@media (max-width:560px){.acct .sheet-body{gap:9px}.ac-f{gap:4px}.ac-f input{padding:8px 10px}.ac-line{font-size:13px;margin-top:10px}.ac-ver{font-size:12px;margin-top:10px}}
</style>`);

  /* ---- staying up to date ----
     A home-screen app has no reload button, and a phone keeps showing the copy of the page it already has open
     (or has kept) long after a newer one is published. So each time Pulse comes to the front it asks the site
     when the page was last published (the headers only, nothing is sent), and if that's later than the copy
     that's running, loads the new one: there and then when nothing is open or being typed, otherwise the next
     time Pulse comes to the front. Edits not yet synced are kept in this browser and sent after the reload.
     Tried twice at most for any one version (the second time past whatever the browser has kept), so a
     browser that keeps handing back the old copy doesn't reload in a loop. */
  const born = Date.parse(document.lastModified) || 0, TRY_KEY = "pulse-update-try";
  if (/^\?v=\d+$/.test(location.search)) { try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {} }
  let newer = 0, asked = 0;
  const idle = () => !document.querySelector("dialog[open]") && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || "");
  function update() {
    if (!newer || !idle()) return;
    let tries = 0;
    try { const [v, n] = (sessionStorage.getItem(TRY_KEY) || "").split(":"); if (+v === newer) tries = +n || 0;
      if (tries >= 2) return;
      sessionStorage.setItem(TRY_KEY, newer + ":" + (tries + 1)); } catch (e) { return; }
    if (tries) location.replace(location.pathname + "?v=" + newer + location.hash); else location.reload();
  }
  async function checkUpdate() {
    if (!born || !/^https?:$/.test(location.protocol) || document.hidden) return;
    if (Date.now() - asked > 30000) {
      asked = Date.now();
      try {
        const r = await fetch(location.pathname, {method: "HEAD", cache: "no-store"});
        const at = r.ok ? Date.parse(r.headers.get("last-modified") || "") : 0;
        if (at > born + 1500) newer = at;
      } catch (e) {}
    }
    update();
  }
  addEventListener("pageshow", checkUpdate);
  document.addEventListener("visibilitychange", checkUpdate);
  const version = () => born ? `<p class="ac-ver">This copy of Pulse was published ${safe(new Date(born).toLocaleString([], {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"}))}. It updates itself when you open it.</p>` : "";

  /* ---- what the page shows ---- */
  const safe = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;"}[c]));
  window.PULSE_HOST = {
    ns: nsOf(me && me.uid), uid: me ? me.uid : null, email: me ? me.email : null,
    // the card on Your data
    panelHTML: status => me
      ? `<div class="panel dl-acct"><h2 style="margin-bottom:10px">Account</h2>
          <div class="set-row" style="border-top:0;padding:0"><p class="set-k" style="overflow-wrap:anywhere">${safe(me.email || "Signed in")}<small class="acct-status">${safe(status || "")}</small></p>
          <button type="button" class="btn sm" data-acct="out">Sign out</button></div>${version()}</div>`
      : `<div class="panel dl-acct"><h2 style="margin-bottom:6px">Account</h2>
          <p class="explain">Sign in to keep your supplements, tags, check-ins and settings in a Pulse account, so they follow you to every device. Health data isn't sent anywhere: it stays in this browser.</p>
          <div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn primary" data-acct="in">Sign in</button><button type="button" class="btn" data-acct="new">Create an account</button></div>${version()}</div>`,
    // the line under the upload box, before any Health data is loaded
    welcomeHTML: () => me
      ? `<p class="ac-line">Signed in as <b style="overflow-wrap:anywhere">${safe(me.email || "your account")}</b> · <button type="button" class="linkbtn" data-acct="out">Sign out</button></p>`
      : `<p class="ac-line">Have a Pulse account? <button type="button" class="linkbtn" data-acct="in">Sign in</button> · <button type="button" class="linkbtn" data-acct="new">Create one</button></p>`,
  };
})();
</script>
<title>Pulse Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Lexend:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#f3f7f6; --surface:#ffffff; --surface-2:#eaf1ef; --line:#d8e3e0; --grid:#e6eeec;
  --text:#122220; --text-sub:#4c615d; --ink-3:#7b8f8b;
  --accent:#0c8277; --accent-ink:#ffffff; --accent-soft:#d6efeb;
  --sleep:#6a5acd; --heart:#d4474a; --act:#0d8a7e; --body:#c27a12; --deep:#3b2f9e; --core:#7d6fe0; --rem:#4fa6e8; --awake:#e39a4c;
  --good:#107a37; --good-soft:#dcf1e2; --ok:#39726c; --ok-soft:#e1eeec; --warn:#945a00; --warn-soft:#fbecd0; --bad:#b83232; --bad-soft:#f8dddd;
  --shadow:0 1px 2px rgba(18,34,32,.06),0 4px 16px rgba(18,34,32,.05);
  /* Type: Lexend for words, JetBrains Mono for numbers (stat values, axes, tooltips, counts, amounts) */
  --font-text:"Lexend",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0c1413; --surface:#131e1c; --surface-2:#1a2826; --line:#253633; --grid:#1f2e2c;
