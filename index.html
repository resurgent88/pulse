/* no zooming on a phone: no double-tap zoom here, no pinch (the viewport tag, and the script for iOS, which ignores it) */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* nothing on the page scrolls sideways (wide tables and tab strips scroll inside their own boxes); clip, not
   hidden, so the sticky header still sticks */
html,body{overflow-x:clip}
/* iOS zooms in on any text box set smaller than 16px when it takes the focus (tapping it, or the keyboard's
   arrows moving to it), and an app showing the page can ignore the viewport tag that would stop it; at 16px it
   doesn't zoom at all */
@media (pointer:coarse){input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{font-size:16px!important}}
/* On a touch screen the small controls (text links, the gear, "How this works" rows, the check-in's page dots)
   take a tap from a little outside what they draw: an unseen margin around each, so nothing moves or grows */
@media (pointer:coarse){
  .linkbtn,.tb-gear,.ci-dot,.s-opt,summary{position:relative}
  .linkbtn::before,.s-opt::before,summary::before{content:"";position:absolute;inset:-8px -4px}
  .tb-gear::before{content:"";position:absolute;inset:-7px}
  .ci-dot::before{content:"";position:absolute;inset:-11px 0}
}
h1,h2,h3{font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
/* headings wear the theme's second colour (--title); Auto and a theme without one keep the text colour */
h1,h2,h3,h4{color:var(--title,var(--text))}
h1{font-size:clamp(28px,5vw,40px);line-height:1.1}
h2{font-size:22px;line-height:1.2}
h3{font-size:16px;font-weight:700;letter-spacing:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
/* numbers: .num anywhere; a form field needs the input named, or the forms' font:inherit wins */
.num,.rcard input.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
svg text.num{font-weight:500}
/* digits inside a line of text: supplement amounts */
.amt{font-family:var(--font-num);font-weight:500;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.brand svg{width:30px;height:30px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:999px;color:var(--text-sub);font-weight:600;white-space:nowrap}
.tab:hover{color:var(--text);background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--text);color:var(--ground)}
@media (max-width:640px){.top .wrap{gap:8px}.tabs{flex-basis:100%;order:3}}

main{padding-block:24px 48px}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px}
.sub{color:var(--text-sub);max-width:62ch}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--warn-soft);color:var(--text);border-radius:12px;padding:10px 14px;margin-bottom:20px}
.banner button{margin-left:auto}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.panel + .panel{margin-top:16px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.explain{color:var(--text-sub);font-size:14px;margin-bottom:14px;max-width:70ch}
.grid{display:grid;gap:12px}
.cards{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
@media (max-width:560px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:12px}.card .val{font-size:24px}.card .vs{font-size:12.5px}}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.two .panel + .panel{margin-top:0}

.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);transition:border-color .15s,translate .18s ease,box-shadow .18s ease}
button.card:hover{border-color:var(--accent)}
/* a card opens its full history: a small arrow in its corner says so, and nudges over on hover */
.cards:not(.arranging) > button.card::after{content:"";position:absolute;top:17px;right:16px;width:6px;height:6px;border-top:2px solid var(--text-sub);border-right:2px solid var(--text-sub);transform:rotate(45deg);opacity:.45;transition:opacity .15s,translate .18s ease}
.cards:not(.arranging) > button.card:hover::after{opacity:1;translate:2px 0}
@media (hover:hover){.cards:not(.arranging) > button.card:hover{translate:0 -2px;box-shadow:0 8px 22px rgba(0,0,0,.14)}}
/* Summary reads top down: a heading for the cards, and the first two (whichever you put first) larger, as the lead */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;margin:0 0 10px}
.sec-head h2{font-size:17px}
.sec-head span{font-size:13px;color:var(--text-sub)}
.cards > .card.lead{grid-column:span 2}
@media (min-width:760px){
  .cards > .card.lead{padding:18px 20px}
  .cards > .card.lead .val{font-size:40px}
  .cards > .card.lead .vs{font-size:14px}
  .cards > .card.lead .spark{height:48px}
}
/* the stress card has no sparkline; leading, it says in a line what the score means instead (as the Stress tab does) */
.card .lead-line{display:none}
.cards > .card.lead .lead-line{display:block}
.card .lead-line.why{font-size:13px}
/* two wide cards side by side: their findings lines sit at the bottom of each, so they line up across the row */
.cards > .card.lead .card-find{margin-top:auto}
/* arranging the Summary cards: the gear by the heading turns it on, and each card can then be dragged */
.sum-gear{margin:0 0 2px auto}
.cards.arranging > .card{position:relative;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.cards.arranging > .card .cgrip{position:absolute;top:4px;right:4px;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--text-sub);cursor:pointer}
.cards.arranging > .card .cgrip:hover{background:var(--surface-2);color:var(--text)}
.cards.arranging > .card .cgrip svg{width:16px;height:16px}
/* arranging: a card's size and remove buttons, beside its dots */
.cards.arranging > .card .ctools{position:absolute;top:4px;right:36px;display:flex;gap:2px}
.cbtn{width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:8px;background:none;color:var(--text-sub);padding:0;cursor:pointer}
.cbtn:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
.cbtn.c-del:hover:not(:disabled){color:var(--bad)}
.cbtn:disabled{opacity:.35;cursor:default}
.cbtn svg{width:15px;height:15px}
.cards.arranging > .card .label{padding-right:100px}
/* the tile that adds a card, at the end while arranging */
.card.card-add{align-items:center;justify-content:center;flex-direction:row;gap:8px;min-height:120px;border:2px dashed var(--line);background:none;box-shadow:none;color:var(--text-sub);font-weight:600;font-size:14.5px;cursor:pointer}
.card.card-add span{font-size:22px;font-weight:500;line-height:1}
.card.card-add:hover:not(:disabled){border-color:var(--accent);color:var(--text)}
.card.card-add:disabled{cursor:default;opacity:.7}
.cards.arranging > .card.dragging{z-index:2;border-color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.28);cursor:grabbing}
.cards.sorting > .card:not(.dragging){transition:transform .15s ease,border-color .15s}
/* the small uppercase label: .lbl, and every label that wears the same look */
.lbl,.card .label,.stats span,.kv div span,.mtile > span,.hc-chip span,.ring-h,.eyebrow,.dl-stat .k{font-size:11.5px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--text-sub)}
.card .label{display:flex;align-items:center;gap:6px}
.card .label i{width:8px;height:8px;border-radius:50%;display:inline-block}
.card .val{font-family:var(--font-num);font-size:30px;font-weight:700;line-height:1.1}
.card .val small{font-family:var(--font-text);font-size:14px;font-weight:500;color:var(--text-sub);margin-left:3px}
.card .vs{font-size:13px;color:var(--text-sub)}
.card .when{font-size:12px;color:var(--text-sub)}
.card svg.spark{width:100%;height:34px;margin-top:6px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:700;font-size:13px}
.pill svg{width:12px;height:12px}
.lv-low{background:var(--good-soft);color:var(--good)}
.lv-normal{background:var(--ok-soft);color:var(--ok)}
.lv-elevated{background:var(--warn-soft);color:var(--warn)}
.lv-high{background:var(--bad-soft);color:var(--bad)}

.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-sub)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* The highlight behind the chosen option (segmented controls and the tab bar) is one element that slides to
   whichever option is picked. The script adds .has-ind once the slider is in place, and the option's own
   highlight steps aside; without the script the option keeps its own highlight. */
.seg,.tabs{position:relative}
.seg > button,.tabs > .tab{position:relative;z-index:1;transition:color .2s ease}
.seg-ind{position:absolute;left:0;top:0;z-index:0;pointer-events:none;transition:transform .25s cubic-bezier(.2,.8,.2,1),width .25s cubic-bezier(.2,.8,.2,1),height .25s cubic-bezier(.2,.8,.2,1)}
.seg-ind.jump{transition:none}
.seg > .seg-ind{background:var(--surface);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs > .seg-ind{background:var(--text);border-radius:999px}
.seg.has-ind > button[aria-pressed="true"]{background:none;box-shadow:none}
.tabs.has-ind > .tab[aria-selected="true"]{background:none}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;max-width:100%}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--text-sub)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.quiet{background:none}
.btn:disabled{opacity:.5;cursor:default}

/* chart */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--text);color:var(--ground);font-family:var(--font-num);font-weight:500;font-variant-numeric:tabular-nums;font-size:12.5px;padding:7px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);z-index:5;line-height:1.4}
.chart .tip b{font-weight:700}
/* the tooltip glides from day to day as a finger or the mouse moves across, and pops in the first time */
.chart .tip.glide{transition:left .12s cubic-bezier(.2,.8,.2,1)}
.chart .tip.in{animation:tip-in .16s ease-out}
@keyframes tip-in{from{opacity:0;transform:translate(-50%,-100%) translateY(4px) scale(.96)}}
.chart .xh{transition:transform .12s cubic-bezier(.2,.8,.2,1)}
/* a chart draws itself in the first time it comes into view: bars grow up from their baseline in a quick wave, lines
   trace from left to right, dots and shaded areas fade in (the classes are on the marks drawChart makes) */
.chart-in .br{transform-box:fill-box;animation:bar-grow .34s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 4ms)}
.chart-in .ln{stroke-dasharray:1;animation:line-draw .45s cubic-bezier(.3,.6,.3,1) backwards}
/* each mark fades from nothing up to its own opacity (--o, set on it where it's drawn), never past it: the usual-range
   band ends as see-through as it always is. Shaded areas take a little longer, so their fade can be seen */
.chart-in .dt{animation:mark-in .3s ease-out backwards;animation-delay:.12s}
.chart-in .ar{animation:mark-in .6s ease-out backwards;animation-delay:.08s}
@keyframes mark-in{from{opacity:0}to{opacity:var(--o,1)}}
/* dense: one reveal from left to right for the whole chart, so it stays smooth to hover while it plays */
.chart-in svg.dense .br,.chart-in svg.dense .dt,.chart-in svg.dense .ln,.chart-in svg.dense .ar{animation:none}
.chart-in svg.dense{animation:chart-sweep .5s cubic-bezier(.3,.6,.3,1) backwards}
@keyframes chart-sweep{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes bar-grow{from{transform:scaleY(0)}}
@keyframes line-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--text-sub);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.dash{height:0;border-top:2px dashed var(--text-sub);width:16px;border-radius:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--font-num);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.empty-note{color:var(--text-sub);font-size:14px;padding:24px 0;text-align:center}

/* table */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-sub);text-align:left;font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
td.r{font-family:var(--font-num);font-weight:500}
/* the week table reads like the Summary cards: the metric's colour dot, the number bright, the unit muted */
.mname{display:inline-flex;align-items:center;gap:8px}
.mname i{width:8px;height:8px;border-radius:50%;flex:none}
td.r small{font-family:var(--font-text);font-size:12.5px;font-weight:500;color:var(--text-sub);margin-left:3px}
.up{color:var(--text)} .chg{font-weight:700;white-space:nowrap}
.chg.good{color:var(--good)} .chg.bad{color:var(--bad)} .chg.same{color:var(--text-sub)}

/* stress */
.stress-hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
@media (max-width:640px){.stress-hero{grid-template-columns:1fr;gap:16px}}
.gauge{width:180px;max-width:100%}
.stress-hero .big{font-family:var(--font-text);font-size:22px;font-weight:700;line-height:1.25;margin:8px 0 6px}
.drivers{display:flex;flex-direction:column}
.driver{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--grid)}
/* every row shares one set of columns, so the label column is as wide as the longest label in all of them and
   each bar is the same width: their centre marks sit in one line down the card */
@supports (grid-template-columns:subgrid){
  .drivers{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;column-gap:14px}
  .driver{grid-column:1/-1;grid-template-columns:subgrid}
}
.driver:last-child{border-bottom:0}
.driver .what b{display:block}
.driver .what span{font-size:13px;color:var(--text-sub)}
.dbar{position:relative;height:10px;background:var(--surface-2);border-radius:5px}
.dbar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink-3)}
.dbar i{position:absolute;top:0;bottom:0;border-radius:5px}
.effect{font-size:12.5px;font-weight:700;white-space:nowrap;text-align:right}
@media (max-width:560px){.driver{grid-template-columns:1fr auto}.driver .dbar{grid-column:1/-1;order:3}}
.strip{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:4px}
.strip button{height:28px;border-radius:5px;border:0;padding:0;min-width:0}
.strip button:disabled{cursor:default}
.strip button:not(:disabled):hover{filter:brightness(1.12)}
/* the day shown in the gauge above */
.strip button.sel{outline:2px solid var(--text);outline-offset:1px}
@media (max-width:560px){.strip{grid-template-columns:repeat(15,minmax(0,1fr))}}
.strip .none{background:var(--surface-2)}
.strip-scale{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--text-sub);margin-top:10px}
.strip-scale span{display:inline-flex;gap:6px;align-items:center}
.strip-scale i{width:12px;height:12px;border-radius:3px;display:inline-block}
details{margin-top:4px}
summary{cursor:pointer;font-weight:600}
details ul{color:var(--text-sub);padding-left:20px;margin:10px 0 0}
details li+li{margin-top:6px}

/* sleep */
.stagebar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin:10px 0 8px}
.stagebar div{height:100%}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.kv div span{display:block}
.kv div b{font-size:20px;font-family:var(--font-num);font-weight:700;font-variant-numeric:tabular-nums}
.chart.pickable svg{cursor:pointer}
/* a panel that opens up into the middle of the screen (zoomOpen): tapping it anywhere but the chart or a control */
.zoomable:not(.zoomed){cursor:zoom-in}
.zoomable .chart{cursor:default}
dialog.zoom{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:none;color:var(--text);overflow:hidden}
dialog.zoom::backdrop{background:rgba(0,0,0,.55);animation:fade-in .3s ease-out}
dialog.zoom.closing::backdrop{animation:fade-out .26s ease-in forwards}
dialog.zoom:focus{outline:none}
.panel.zoomed{position:absolute;left:0;top:0;margin:0!important;transform-origin:top left;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.kv .delta{display:block;font-size:12px;font-weight:400;color:var(--text-sub);margin-top:3px}
.stage-legend small{color:var(--text-sub)}
.mtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.mtile{background:var(--surface-2);border-radius:12px;padding:12px 14px}
/* a flex column, so its text starts at the top like the tiles beside it when the row is taller than it (a button centres by default) */
button.mtile{display:flex;flex-direction:column;justify-content:flex-start;width:100%;text-align:left;border:0;font:inherit;color:inherit}
button.mtile:hover:not(:disabled){background:color-mix(in srgb,var(--text) 7%,var(--surface-2))}
button.mtile:disabled{cursor:default}
.mtile > span{display:block}
.mtile b{display:block;font-family:var(--font-num);font-weight:700;font-variant-numeric:tabular-nums;font-size:24px;line-height:1.25;margin-top:4px}
.mtile b small{font-family:var(--font-text);font-size:13px;font-weight:500;color:var(--text-sub)}
.mtile em{font-style:normal;display:block;font-size:12.5px;color:var(--text-sub);margin-top:2px}
.mtile details{margin-top:6px}
.mtile summary{font-size:12.5px;font-weight:600;color:var(--text-sub)}
.mtile details ul{font-size:13px;margin-top:8px;padding-left:18px}
/* the tile that flips between bedtime and wake time: a flip mark in its corner that turns under the pointer, a
   small tilt on arriving at Sleep until it has been flipped once, and a turn over when it's tapped */
button.mtile.flip{position:relative}
.flip-i{position:absolute;top:11px;right:11px;width:15px;height:15px;color:var(--text-sub);opacity:.75;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .2s}
/* the arrows give a small turn every few seconds, part of the way round and back, to say the tile turns over; the two
   flipping tiles take turns. Under the pointer they turn part way and hold */
@keyframes flip-i-nudge{0%,82%,100%{transform:none}89%{transform:rotate(60deg)}95%{transform:rotate(-8deg)}}
button.mtile.flip:not(:disabled) .flip-i{animation:flip-i-nudge 6s ease-in-out 3s infinite}
#clockTile:not(.peek) .flip-i{animation-delay:6s}
button.mtile.flip:hover:not(:disabled) .flip-i,button.mtile.flip:focus-visible .flip-i{opacity:1;animation:none;transform:rotate(60deg)}
button.mtile.flip:disabled .flip-i{display:none}
@keyframes tile-peek{0%,100%{transform:perspective(600px) rotateX(0)}35%{transform:perspective(600px) rotateX(-14deg)}70%{transform:perspective(600px) rotateX(5deg)}}
@keyframes flip-i-turn{0%,100%{transform:none}50%{transform:rotate(60deg)}}
button.mtile.flip.peek{animation:tile-peek .9s ease-in-out .7s 1}
button.mtile.flip.peek .flip-i{animation:flip-i-turn .9s ease-in-out .7s 1}
/* the chart's own controls on one row: which nights (the range, which the night card's averages use too) on the left, how they're drawn on the right */
.sleep-views{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:16px 0 10px}
/* the consistency tile's explainer, kept under the chart so opening it never stretches the tiles */
.sleep-how{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.sleep-how summary{font-size:13.5px;color:var(--text-sub)}
.sleep-how ul{font-size:14px;max-width:70ch}
/* heart */
.hc-line{font-family:var(--font-text);font-size:24px;font-weight:700;line-height:1.25;margin:6px 0 8px}
.hc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.hc-chip{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.hc-chip b{font-family:var(--font-num);font-weight:700;font-variant-numeric:tabular-nums;font-size:20px}
.hc-chip .hc-avg{display:block;white-space:nowrap;font-size:11.5px;text-transform:none;letter-spacing:0;opacity:.8}
.hc-chip em{font-style:normal;font-size:13px;font-weight:600}
.t-bad,.dayrow .v small.t-bad{color:var(--warn)} .t-good,.dayrow .v small.t-good{color:var(--good)} .t-flat{color:var(--text-sub)}
.sick{border-radius:14px;padding:14px 16px;margin-top:16px;background:var(--surface-2)}
.sick.on{background:var(--warn-soft)}
.sick h3{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sick p{color:var(--text-sub);font-size:14px}
.sick.on p{color:var(--text)}
.sigs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sig{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.sig i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sig.off i{background:var(--warn)} .sig.na{color:var(--text-sub)} .sig.na i{opacity:.5}
.dayrows{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 20px;margin-top:10px}
.dayrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--grid)}
.dayrow .n{font-weight:600}
.dayrow .n small{display:block;font-size:12.5px;font-weight:500;color:var(--text-sub)}
.dayrow.sickrow{display:block}
.sickhead,.rfoot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sickhead .n small b{font-weight:600;color:var(--text)}
.sickhead .n small b.t-bad{color:var(--warn)}
.sickmeter{display:flex;justify-content:flex-end;gap:3px;flex:none}
.sickmeter i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.sickmeter i.na{background:none;border:1px dashed var(--ink-3)}
.sickmeter i.on{background:var(--warn)}
.sickmeter.flagged i.on{background:var(--bad)}
.dayrow .v{text-align:right;font-family:var(--font-num);font-weight:700;font-variant-numeric:tabular-nums}
.dayrow .v small{display:block;font-family:var(--font-text);font-weight:500;font-size:12.5px;color:var(--text-sub);white-space:nowrap}
/* heart rate chart on Health Check: a day with no readings through the day shows its one average */
.hr-one{display:flex;flex-direction:column;gap:4px;padding:18px 0 8px}
.hr-one b{font-family:var(--font-num);font-weight:700;font-size:30px;line-height:1.1}
.hr-one b small{font-family:var(--font-text);font-size:14px;font-weight:500;color:var(--text-sub);margin-left:3px}
.hr-one span{font-size:13.5px;color:var(--text-sub);max-width:62ch}
#nightPanel,#hDay,#stressDay,#hbCheck,#hbCounts{scroll-margin-top:110px}
/* the day that's leaving, sliding out over the new one as a day card swipes (swipeSwap) */
.swipe-ghost{position:absolute;pointer-events:none}
/* "back to latest": every day from this one to the latest in a row, sliding past as one (slideBack) */
.swipe-strip{position:absolute;display:flex;align-items:flex-start;pointer-events:none}
.swipe-pane{flex:none}
/* a panel whose body folds away under its title */
details.more{margin:0}
details.more > summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary > svg{width:16px;height:16px;flex:none;color:var(--text-sub);transition:transform .15s}
details.more[open] > summary > svg{transform:rotate(90deg)}
.more-hint{margin-left:auto;font-size:13px;font-weight:600;color:var(--text-sub)}
details.more > summary:hover .more-hint{color:var(--text)}
details.more[open] .more-show,details.more:not([open]) .more-hide{display:none}
.nightnav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nightnav .date{color:var(--text-sub);font-size:14px;margin-right:2px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;padding:0;color:var(--text-sub)}
.iconbtn:hover:not(:disabled){border-color:var(--text-sub);color:var(--text)}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:14px;height:14px}
.linkbtn{border:0;background:none;padding:0;color:var(--text);font-weight:600;font-size:14px;text-decoration:underline;text-decoration-color:var(--text-sub);text-decoration-thickness:1.5px;text-underline-offset:3px}
.linkbtn:hover:not(:disabled){text-decoration-color:var(--text)}
.linkbtn:disabled{color:var(--text-sub);text-decoration:none;cursor:default}

/* tags */
.muted{color:var(--text-sub)}
.tb-add{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13.5px;font-weight:600;color:var(--text-sub);line-height:1.2}
button.chip:hover{border-color:var(--text-sub);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.chip.ghost{border-style:dashed}
.chip.sm{padding:5px 10px;font-size:12.5px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface)}
.search svg{width:16px;height:16px;color:var(--text-sub);flex:none}
.search input{border:0;background:none;font:inherit;color:var(--text);padding:9px 0;flex:1;min-width:0;outline:none}
.search:focus-within{border-color:var(--accent)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:thin}
.filters .chip{white-space:nowrap}
.tb-list{container:tb / inline-size}
.tb-list h4{font-family:var(--font-text);font-size:15px;margin:16px 0 4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tb-list h4 .muted{font-family:var(--font-text);font-size:12.5px;font-weight:400}
.tb-list .when{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-sub);margin:12px 0 0}
.when-toggle{display:flex;align-items:center;gap:6px;width:100%;min-height:32px;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.when-toggle svg{width:12px;height:12px;flex:none;transition:transform .15s}
.when-toggle[aria-expanded="true"] svg{transform:rotate(90deg)}
.when-toggle:hover{color:var(--text)}
.when-sum{margin-left:auto;font-size:12.5px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--text-sub)}
.when-sum.on{color:var(--text);font-weight:600}
.trow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--grid);min-height:44px;flex-wrap:wrap}
/* A modest flex-basis keeps the dose fields on the name's line: a long compound label wraps
   inside its own column instead of shoving the whole block down to a row of its own. Narrower
   than the @container rule below, every row stacks, so the list never mixes the two. */
.tbtn{flex:1 1 11em;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:8px 2px;font-size:14.5px;min-width:min(100%,9em)}
.tbtn > span{min-width:0}
.tbtn .dose{display:block;font-size:12.5px;color:var(--text-sub);font-weight:400;margin-top:1px}
.box{width:20px;height:20px;border-radius:6px;border:2px solid var(--ink-3);display:grid;place-items:center;flex:none;color:transparent}
.box svg{width:13px;height:13px}
.trow.on .box,.drow.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.star{border:0;background:none;color:var(--text-sub);width:34px;height:34px;display:grid;place-items:center;border-radius:8px;font-size:18px;flex:none}
.tbtn:disabled{opacity:.55;cursor:default}
.lib-list{margin-top:4px}
.star:hover{color:var(--text);background:var(--surface-2)}
.star[aria-pressed="true"]{color:var(--warn)}
.star svg{width:16px;height:16px}
.rangebox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;padding:8px 0 10px 32px;color:var(--text-sub);border-bottom:1px solid var(--grid)}
.rangebox input,.addrow input,.addrow select,.rcard input,.rcard select{font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.btn.sm{padding:5px 10px;font-size:13px}
/* Daily check-in: one row per supplement, always the same height. The control and the summary are
   drawn whether or not the box is ticked, and every column has a fixed width or truncates, so ticking
   a box or changing a count only changes colours and numbers — nothing appears, wraps or moves. */
.drow{display:grid;grid-template-columns:minmax(0,1.2fr) 190px minmax(0,1fr);grid-template-areas:"name ctl sum";align-items:center;column-gap:12px;height:52px;border-bottom:1px solid var(--grid)}
.drow .tbtn{grid-area:name;min-width:0;height:100%;padding:0 2px}
.drow .dname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dctl{grid-area:ctl;display:flex;align-items:center;gap:4px;height:32px}
.stp{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:grid;place-items:center;padding:0;font-size:18px;line-height:1;color:var(--text-sub);flex:none}
.stp:hover:not(:disabled){border-color:var(--text-sub);color:var(--text)}
.stp:disabled{opacity:.35;cursor:default}
.sv{width:2.6em;text-align:center;font-family:var(--font-num);font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.dunit{width:5.4em;margin-left:4px;font-size:13px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.dsum{grid-area:sum;font-size:13px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* a row not taken yet reads in the muted colour; its summary stays readable */
.drow:not(.on) .sv{color:var(--text-sub)}
.drow:not(.on) .stp:not(:disabled){opacity:.55}
.drow.on .dsum .amt{color:var(--text)}
.dsum.flag{color:var(--warn);font-weight:600}
@container tb (max-width:520px){
  /* the unit word moves out: the summary line under the name already says it, and Lexend needs the room for the name */
  .drow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name ctl" "sum sum";grid-template-rows:40px 20px;height:70px;align-content:center}
  .dunit{display:none}
  .dsum{padding-left:32px;line-height:20px}
  .drow.arrange{grid-template-areas:"name ctl" "sum ctl"}
  .drow.arrange .dctl{margin:-4.5px 0}
}
/* the day's totals: one cell per ingredient in any recipe, in a fixed grid, so the block keeps its
   size whatever is ticked */
.dtot{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:8px 0 4px}
.dchip{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13px;color:var(--text-sub);white-space:nowrap;overflow:hidden;min-width:0}
.dchip span{overflow:hidden;text-overflow:ellipsis}
.dchip b{color:var(--text);font-weight:600;flex:none}
.dchip b .amt{font-weight:700}
.dchip.zero b{color:var(--text-sub);font-weight:500}
.dchip.over{border-color:var(--warn);background:var(--warn-soft)}
.dchip.over b{color:var(--warn)}
.est-key{color:var(--text-sub);font-size:12.5px;margin:2px 0 4px}
.ci-takenlist{margin-top:8px}
#hbTaken .dtot{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}   /* a narrower card than the day's list: wider cells, so names fit */
.caf{font-size:13.5px;color:var(--text-sub);margin:2px 0 4px}
.tags-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 0 2px;padding-top:14px;border-top:1px solid var(--line)}
.tags-head h4{font-family:var(--font-text);font-size:17px}
.tags-head.solo{justify-content:flex-end;margin-top:6px;padding-top:0;border-top:0}
.supp-h .tb-gear{margin:-4px 0 -4px auto;align-self:center}
.cat-toggle{width:100%;display:flex;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--grid);background:none;padding:12px 2px;font-family:var(--font-text);font-size:15px;font-weight:700;text-align:left;min-height:48px}
.cat-toggle:hover{background:var(--surface-2)}
.cat-toggle svg{width:14px;height:14px;flex:none;color:var(--text-sub);transition:transform .15s}
.cat-toggle[aria-expanded="true"] svg{transform:rotate(90deg)}
.cat-sum{margin-left:auto;font-family:var(--font-text);font-size:12.5px;font-weight:500;color:var(--text-sub);text-align:right;padding-left:8px}
.cat-sum.on{color:var(--text);font-weight:600}
.cat-toggle[aria-expanded="true"] + .cat-body{padding-left:24px}
.tb-add-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
/* the ⚙ that arranges the supplements: the panel's own colour, its right edge on the fields' edge below, centred on
   the label. It only lights up under the pointer; while arranging, the gear itself stays in the accent colour */
.tb-gear{border-color:transparent;background:none;width:26px;height:26px;margin:-3px 0;flex:none}
.tb-gear svg{width:16px;height:16px}
.tb-gear:hover:not(:disabled){border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.tb-gear[aria-pressed="true"]{color:var(--accent)}
/* arranging the check-in: the box turns into a pencil (tap to edit) and the count controls into a handle to drag */
.supp-h{scroll-margin-top:96px}
.arr-note{font-size:13px;color:var(--text-sub);margin:2px 0 6px}
.arr-note svg{width:13px;height:13px;vertical-align:-2px}
.arr-note .linkbtn{font-size:13px;margin-left:4px}
.drow.arrange .box{border-color:transparent;color:var(--text-sub)}
.drow.arrange .tbtn:hover .box{color:var(--text)}
.drow.arrange .dctl{justify-content:flex-end}
.grip{width:36px;height:36px;border:0;background:none;border-radius:8px;display:grid;place-items:center;padding:0;color:var(--text-sub);cursor:grab;touch-action:none;flex:none}
.grip:hover{background:var(--surface-2);color:var(--text)}
.grip svg{width:16px;height:16px}
.vbar{display:block;width:5px;height:22px;border-radius:3px;background:color-mix(in srgb,currentColor 40%,transparent)}
/* in the list the handle runs the full height of its row, stopping just short of the dividers so each row keeps its own */
.drow.arrange .dctl{align-self:stretch;height:auto}
.drow.arrange .grip{height:100%;display:flex;justify-content:center;align-items:stretch;border-radius:0}
.drow.arrange .grip:hover{background:none}
.drow.arrange .grip .vbar{height:auto;margin:3px 0}
.arr-note .vbar{display:inline-block;width:4px;height:13px;margin:0 3px;vertical-align:-2px}
.drow.dragging{position:relative;z-index:2;background:var(--surface);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.28);cursor:grabbing}
.drow.dragging .grip{cursor:grabbing}
.sorting > .drow:not(.dragging){transition:transform .15s ease}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1;min-width:140px}
.addrow select{max-width:100%}
dialog.sheet{border:1px solid var(--line);border-radius:18px;padding:0;background:var(--surface);color:var(--text);width:min(580px,calc(100vw - 24px));max-width:none;max-height:min(800px,calc(100dvh - 24px));box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
dialog.sheet[open]{display:flex;flex-direction:column;animation:sheet-in .26s cubic-bezier(.2,.9,.25,1)}
dialog.sheet::backdrop{background:rgba(0,0,0,.5)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 4px;flex:none}
/* a long heading or subtitle never squeezes the close button out of its square */
.sheet-head > .iconbtn{flex:none}
/* flex-basis auto, not 0: Safari sized a sheet to its heading alone and left the body a sliver to scroll in */
.sheet-body{padding:6px 20px 20px;overflow:auto;flex:1 1 auto;min-height:0}
/* on a phone a sheet sits in the middle of the screen as it does on a computer, nearly full width and only as
   tall as what's in it */
@media (max-width:560px){
  dialog.sheet{width:calc(100vw - 16px);max-height:calc(100dvh - 32px);margin:auto}
  /* the header with the tabs gets out of the way while a sheet is open */
  .top{transition:transform .2s ease,opacity .2s ease}
  body:has(dialog.sheet[open]) .top{transform:translateY(-100%);opacity:0}
}
/* a yes/no question stays a small centred box, phones included */
dialog.sheet.ask{width:min(420px,calc(100vw - 32px));height:fit-content;max-height:calc(100dvh - 32px);border:1px solid var(--line);border-radius:18px;margin:auto}
.ask .sheet-body{display:flex;flex-direction:column;gap:14px;padding-top:2px}
.ask .explain{margin:0}
.ask-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.chk input{width:16px;height:16px;margin:0;accent-color:var(--accent);flex:none}
.set-h{display:flex;align-items:center;gap:8px}
.set-h svg{width:20px;height:20px;color:var(--text-sub);flex:none}
/* theme picker */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.th{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid rgba(128,128,128,.28);border-radius:10px;padding:13px 14px;font-weight:600;font-size:13.5px;min-height:48px}
.th[aria-pressed="true"]{box-shadow:0 0 0 2px currentColor}
.th > span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th .dots{display:flex;gap:4px;flex:none}
.th .dots i{width:8px;height:8px;border-radius:50%;display:block}
/* the theme button in Settings wears the chosen theme's tile, as it looks in the picker */
.th.th-cur{display:inline-flex;min-width:170px;max-width:100%}
/* habits */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;color:var(--text-sub);text-align:center;font-weight:600;padding-bottom:2px}
.cal button{aspect-ratio:1/1;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:4px 5px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;font-size:12px;overflow:hidden;min-width:0}
.cal button:hover{border-color:var(--text-sub)}
.cal button.sel{outline:2px solid var(--text);outline-offset:1px}
.cal button.hl{background:var(--accent-soft);border-color:var(--accent)}
.cal button.future{opacity:.45;cursor:default}
/* a fully logged day: a ring in the "good" colour, so the gaps between logged days stand out */
.cal button.done{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.cal-done-key{border:2px solid var(--good);background:none!important}
.cal button{position:relative}
/* a supplement started, stopped or changed dose that day */
.cal-chg{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.cal-chg-key{background:var(--accent)!important;border-radius:50%!important;width:8px!important;height:8px!important}
.ci-chg{font-size:13.5px;font-weight:600;padding:7px 10px;margin-bottom:6px;border-radius:9px;background:var(--accent-soft)}
.ci-chg .muted{display:block;font-weight:400;font-size:12.5px;margin-top:1px}
/* the check-in */
.ci-sec{margin-top:16px}
.ci-h{font-size:14.5px;margin-bottom:8px}
/* a check-in chip is one run of text, so "multi-day" wraps along with a long name instead of becoming a column of its own */
.ci-sec .chip{display:inline-block;text-align:left}
.ci-ranges{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:8px}
.ci-ranges .linkbtn{font-size:13px}
.ci-rangebox{padding-left:0;border-bottom:0}
.ci-supp{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--grid);font-size:14px}
.ci-supp .muted{font-size:13px}
.ci-feel{display:grid;grid-template-columns:70px minmax(0,1fr);grid-template-areas:"l b" ". s";align-items:center;column-gap:10px;margin-top:8px}
.ci-fl{grid-area:l;font-weight:600;font-size:14px}
@media (max-width:420px){.ci-feel{grid-template-columns:minmax(0,1fr);grid-template-areas:"l" "b" "s";row-gap:4px;margin-top:12px}}
.fvs{grid-area:b;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ci-scale{grid-area:s;display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-sub);margin-top:3px}
/* each number in the theme's red (worst) through grey to green (best), the colours of the arrows on Summary: a tint of
   it with the number in it, filled with it when it's the one picked. The grey is a plain one, not the theme's muted
   text, which some themes tint (green in matrix), so the middle never reads as good or bad */
.fv{--grey:#8e8e93;--p:var(--grey);height:36px;border-radius:9px;border:0;background:color-mix(in srgb,var(--p) 16%,var(--surface-2));color:var(--p);font-family:var(--font-num);font-weight:700;font-size:15px;padding:0;transition:background .15s,color .15s}
.fv-bad{--p:var(--bad)}
.fv-warn{--p:color-mix(in srgb,var(--bad) 65%,var(--grey))}
.fv-mid{--p:var(--grey)}
.fv-ok{--p:color-mix(in srgb,var(--good) 65%,var(--grey))}
.fv-good{--p:var(--good)}
.fv:hover{background:color-mix(in srgb,var(--p) 30%,var(--surface-2))}
.fv[aria-pressed="true"]{background:var(--p);color:var(--surface)}
/* Habits: the cards stacked under the calendar */
#hbCal ~ .panel{margin-top:16px}
/* the check-in's pages: a window as tall as the page showing, sliding sideways to the next */
.ci-pager{overflow:hidden;transition:height .3s ease;margin:0 -2px;padding:0 2px}
.ci-track{display:flex;align-items:flex-start;will-change:transform}
.ci-page{flex:0 0 100%;min-width:0;padding:0 2px 4px}
.ci-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.ci-nav .btn{display:inline-flex;align-items:center;gap:4px}
.ci-nav .btn svg{width:14px;height:14px}
.ci-prev{padding-left:6px!important} .ci-next{padding-right:6px!important}
.ci-nav .btn:disabled{opacity:.4;cursor:default}
.ci-mid{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;text-align:center}
.ci-dots{display:flex;gap:2px}
.ci-dot{width:18px;height:18px;border:0;background:none;padding:0;display:grid;place-items:center}
.ci-dot::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s,transform .2s}
.ci-dot.on::after{background:var(--accent);transform:scale(1.15)}
.ci-where{font-size:12px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ci-mid{flex:1}
@media (max-width:420px){.ci-nav .ci-bl{display:none}.ci-prev,.ci-next{padding:6px 8px!important}}
.ci-add{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.ci-add input,.ci-add select{font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.ci-add input{flex:1;min-width:140px}
.ci-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.ci-logged{font-weight:700;color:var(--good);position:relative;display:inline-flex;align-items:center;gap:6px}
/* the day just logged: the line pops in, its tick draws itself, and a soft ring goes out from it once */
.ci-logged.now{animation:logged-in .34s cubic-bezier(.2,.9,.3,1.3)}
.ci-logged svg{width:16px;height:16px}
.ci-logged.now svg path{stroke-dasharray:1;animation:line-draw .3s .1s ease-out backwards}
.ci-logged.now::before{content:"";position:absolute;left:-6px;top:50%;width:28px;height:28px;margin-top:-14px;border-radius:50%;border:2px solid var(--good);animation:ring-out .5s ease-out forwards;pointer-events:none}
@keyframes logged-in{from{opacity:0;transform:scale(.85)}}
@keyframes ring-out{from{opacity:.7;transform:scale(.4)}to{opacity:0;transform:scale(2.2)}}
.cal button.just{animation:cal-just .6s ease-out}
@keyframes cal-just{0%{box-shadow:inset 0 0 0 1px var(--good),0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}100%{box-shadow:inset 0 0 0 1px var(--good),0 0 0 10px transparent}}
.ci-feelsec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
/* Summary: yesterday not logged yet */
.log-nudge{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-bottom:14px;padding:12px 16px;border:1px solid var(--accent);border-radius:14px;background:var(--accent-soft);color:var(--text);text-align:left;font:inherit}
.log-nudge b{font-weight:700}
.log-nudge small{display:block;color:var(--text-sub);font-size:13px}
.log-nudge:hover{filter:brightness(1.05)}
.cal button.future:hover{border-color:var(--line)}
.cal .dn{font-family:var(--font-num);font-weight:500;font-variant-numeric:tabular-nums}
.cal .em{font-size:11px;line-height:1;letter-spacing:-1px;white-space:nowrap}
.cal .sb{height:3px;width:100%;background:var(--surface-2);border-radius:2px;overflow:hidden;flex:none}
.cal .sb i{display:block;height:100%;background:var(--good)}
.counts{display:flex;flex-direction:column;gap:10px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 80px 74px;gap:10px;align-items:center;font-size:14px}
.crow b{text-align:right;font-size:13px;font-weight:700;white-space:nowrap}
.cbar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--accent)}
/* what your tags show */
/* three lists behind a switch (a clear effect, no clear effect, still collecting days), each tag on one line: its
   name and days on the left, what differed on the right; narrower than 380px the two stack */
#findView{flex-wrap:wrap}
#hbCounts > .panel-head{align-items:center;margin-bottom:12px}
#findView small{font-family:var(--font-num);font-size:12px;font-weight:500;margin-left:4px;opacity:.8}
.finds{display:flex;flex-direction:column;container:fd / inline-size}
.frow{display:grid;grid-template-columns:minmax(0,10.5em) minmax(0,1fr);gap:4px 14px;align-items:start;padding:9px 0;border-top:1px solid var(--grid)}
.finds > .frow:first-child{border-top:0;padding-top:2px}
.fname{font-weight:600;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.fname small{display:block;font-family:var(--font-num);font-weight:500;font-size:12px;color:var(--text-sub)}
@container fd (max-width:380px){.frow{grid-template-columns:minmax(0,1fr)}}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip .amt{font-weight:600}
.fchip.ftag{font-weight:600}
.fchip.ftag small{font-weight:500;font-size:12px;color:var(--text-sub);margin-left:2px}
.fmore{margin-top:8px;font-size:13px}
.fextra{display:flex;flex-direction:column}
.fchip{font-size:13px;padding:4px 9px;border-radius:8px;background:var(--surface-2);color:var(--text)}
.fchip b{font-weight:700}
.fchip.good{background:var(--good-soft,color-mix(in srgb,var(--good) 16%,transparent));color:var(--good)}
.fchip.bad{background:var(--bad-soft,color-mix(in srgb,var(--bad) 16%,transparent));color:var(--bad)}
.fchip.few{color:var(--text-sub)}
/* a wide Summary card's findings line: opens the full list on Habits */
.card .card-find{display:none;box-sizing:border-box;font-size:13px;color:var(--text-sub);border-top:1px solid var(--grid);padding-top:8px;cursor:pointer}
.cards > .card.lead .card-find{display:block}
.cards > .card.lead > :has(+ .card-find){margin-bottom:6px}   /* at least a little room above it on the taller card */
.card .card-find b{font-weight:600;color:var(--text)}
.card .card-find .t-good{color:var(--good)} .card .card-find .t-bad{color:var(--bad)}
.card .card-find:hover .go{text-decoration:underline}
/* recipes: what one unit of each supplement contains, edited in the supplement dialog */
/* the form is its own "rl" container, so it lays its fields out for the dialog's width */
.rcard{border:1px solid var(--line);border-radius:12px;min-width:0;container:rl / inline-size}
.rcard.open{padding:12px 14px;display:flex;flex-direction:column;gap:10px;border-color:var(--text-sub)}
.rcard.open:focus{outline:none}
.redit .rcard.open{border:0;padding:0}
.rcard input,.rcard select{min-width:0}
.rcard input[type=checkbox]{width:auto;margin:0}
.rcard input:disabled{opacity:.4}
/* notes still exactly as they came, from the basics or the library: a suggestion, in the muted colour until edited */
.rcard input.suggest{color:var(--text-sub)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 124px auto auto;gap:8px 12px;align-items:center}
.rrow [data-f=name]{font-weight:600}
/* the form picker: the button looks like the fields beside it, the list like the page's own panels */
.fsel{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-width:0;font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:left}
.fsel:hover{border-color:var(--text-sub)}
.fsel[aria-expanded="true"]{border-color:var(--accent)}
.fsel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsel svg{width:12px;height:12px;flex:none;color:var(--text-sub);transform:rotate(90deg);transition:transform .15s}
.fsel[aria-expanded="true"] svg{transform:rotate(-90deg)}
.fmenu{position:fixed;inset:auto;margin:0;padding:4px;min-width:150px;overflow:auto;overscroll-behavior:contain;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.3);z-index:60;animation:pop-in .2s ease-out}
.fopt{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:var(--text);padding:8px 14px 8px 8px;border-radius:8px;font-size:14px;text-align:left;white-space:nowrap}
.fopt:hover,.fopt:focus{background:var(--surface-2);outline:none}
.fopt svg{width:14px;height:14px;flex:none;color:var(--accent);visibility:hidden}
.fopt[aria-selected="true"]{font-weight:600}
.fopt[aria-selected="true"] svg{visibility:visible}
.fopt:disabled{opacity:.45}
.fgrp{padding:10px 8px 4px;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--text-sub);white-space:nowrap}
.fgrp:first-child{padding-top:6px}
.s-opt{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-sub);white-space:nowrap;cursor:pointer}
@container rl (max-width:560px){
  .rrow{display:flex;flex-wrap:wrap}
  .rrow [data-f=name]{flex:1 1 100%}
  .rrow [data-f=form]{order:2;flex:1 1 90px}
  .rrow .s-half{order:3} .rrow .s-est{order:4}
}
.rpreset{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--text-sub)}
.rpreset select{max-width:100%}
.ring{display:flex;flex-direction:column;gap:6px}
/* the name stops at about 250px so the amount and unit sit right beside it */
.irow{display:grid;grid-template-columns:minmax(0,250px) 88px 76px auto;justify-content:start;gap:6px;align-items:center}
@container rl (max-width:420px){.irow{grid-template-columns:minmax(0,1fr) 64px 58px auto}}
.rfoot-l{display:flex;flex-wrap:wrap;gap:6px 18px}
/* remove sits quietly beside "Add ingredient" and only turns red under the pointer */
.r-del{font-size:13px;color:var(--text-sub);text-decoration-color:transparent}
.linkbtn.r-del:hover:not(:disabled){color:var(--bad);text-decoration-color:var(--bad)}
.rnote{font-size:12.5px;color:var(--text-sub)}
.rnote.warn{color:var(--warn);font-weight:600}
.rintro{margin-bottom:4px}
.rhow{margin:14px 0 0}
.rhow summary{font-size:13.5px;color:var(--text-sub)}
.rhow ul{font-size:14px;max-width:70ch}
/* the day panel is only as tall as its contents, not stretched to the column beside it */
#hbDay{align-self:start}

/* the supplement library: wide on a computer, the whole screen on a phone. The search sits above the list and
   stays put while the list scrolls under it */
dialog.sheet.lib{width:min(880px,calc(100vw - 48px));max-height:min(860px,calc(100dvh - 48px))}
.lib-top{padding:8px 20px 10px;border-bottom:1px solid var(--line)}
.lib .sheet-body{padding-top:0}
/* the library is tall, so on a phone it runs to near the foot of the screen, and starts below the safe area,
   where an app that lays its own bar over the top of the page says that bar ends */
@media (max-width:640px){dialog.sheet.lib{width:calc(100vw - 16px);height:calc(100dvh - env(safe-area-inset-top,0px) - 24px);max-height:none;margin:calc(env(safe-area-inset-top,0px) + 8px) auto 16px}}
/* a library row: the picture, then the box and the name, with the notes beside the name when they fit */
.lib-row{gap:12px;padding:6px 0}
.lib-row .tbtn{padding:4px 2px}
.lib-row .ltext{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px;row-gap:1px}
.lib-row .ltext .dose{display:inline;margin-top:0}
.lib-row .lnote{flex-basis:100%;font-size:12px;color:var(--ink-3);font-weight:400}
.lib-pic{width:56px;height:56px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--surface-2);color:var(--text-sub);overflow:hidden}
.lib-pic svg{display:block;width:52px;height:52px}
/* a picture, not text: its atom letters can't be selected or dragged (in the list and in the details dialog) */
.lib-pic,.lib-pic *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lib-pic text,.lib-pic tspan{pointer-events:none}
/* an atom label at the edge of a drawing (NH₂, OH) may run past the drawing's box: let it show */
.lib-pic.mol svg{overflow:visible}
.lib-pic.ico svg{width:30px;height:30px}
/* structures take the theme's colours: bonds in the muted ink, atom labels in the text colour. The stroke stays
   the same width on screen however much a molecule is scaled down to fit */
.lib-pic.mol line{stroke:var(--text-sub);stroke-width:1.2px!important;vector-effect:non-scaling-stroke}
.lib-pic.mol polygon,.lib-pic.mol path{fill:var(--text-sub);stroke:var(--text-sub)}
.lib-pic.mol text,.lib-pic.mol tspan{fill:var(--text)}
.lib-pic.mol .element{font:600 11pt var(--font-text)}
.lib-pic.mol .sub{font:600 3pt var(--font-text)}
/* a structure in the library is a button that opens its details */
button.lib-pic{border:0;padding:0;font:inherit;color:inherit;cursor:zoom-in;transition:box-shadow .15s}
button.lib-pic:hover{box-shadow:0 0 0 2px var(--accent)}
/* the details: the main structure large, the others smaller beneath, then the text */
dialog.sheet.mv{width:min(560px,calc(100vw - 24px))}
.mv figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.mv figcaption{font-size:13.5px;font-weight:600;text-align:center}
.mv-main{margin-top:6px!important}
.mv .lib-pic.mv-big{width:min(240px,62vw);height:min(240px,62vw);border-radius:16px}
.mv .lib-pic.mv-sm{width:120px;height:120px;border-radius:12px}
.mv .lib-pic.mol{position:relative}
.mv .lib-pic.mol svg{position:absolute;left:9%;top:9%;width:82%;height:82%}
.mv .lib-pic.mv-big.mol line{stroke-width:2px!important}
.mv .lib-pic.mv-sm.mol line{stroke-width:1.5px!important}
.mv .lib-pic.ico svg{width:40%;height:40%}
.mv-more{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:14px}
.mv-also{font-size:13px;color:var(--text-sub);text-align:center;margin-top:10px}
.mv .lib-pic.mv-wide{width:min(480px,80vw);height:210px}
.mv .lib-pic.mv-ion svg{left:27%;top:27%;width:46%;height:46%}
.mv .lib-pic.mv-form{width:120px;height:120px;border-radius:16px}
.mv-f{display:block;font-family:var(--font-num);font-weight:500;font-size:12.5px;color:var(--text-sub);margin-top:1px}
.mv-center{text-align:center}
.mv-h{font-size:15px;margin:18px 0 4px}
.mv-p{font-size:14.5px;line-height:1.55;max-width:62ch}
.mv-foot{font-size:12.5px;margin-top:16px}
/* on a phone the details sit below whatever bar an app lays over the top of the page (the safe area), smaller, and
   scroll inside themselves when they run longer than the screen */
@media (max-width:560px){
  dialog.sheet.mv{width:calc(100vw - 40px);top:env(safe-area-inset-top,0px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - 56px)}
  .mv .sheet-body{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .mv .sheet-head h2{font-size:19px}
  .mv .lib-pic.mv-big{width:min(170px,46vw);height:min(170px,46vw)}
  .mv .lib-pic.mv-sm{width:96px;height:96px}
  .mv .lib-pic.mv-wide{width:min(320px,70vw);height:150px}
  .mv .lib-pic.mv-form{width:96px;height:96px}
  .mv-h{font-size:14.5px;margin:14px 0 3px}
  .mv-p{font-size:14px;line-height:1.5}
}
/* timing and caution notes on the supplement list: above the day's check-in, and on the library rows involved */
.snotes{display:flex;flex-direction:column;gap:6px;margin:6px 0 8px}
.snotes .linkbtn{align-self:flex-start;font-size:13px}
.snote{display:flex;align-items:flex-start;gap:8px;background:var(--warn-soft);color:var(--text);border-radius:10px;padding:8px 6px 8px 12px;font-size:13px;line-height:1.45}
.snote p{flex:1;min-width:0}
.snote-x{border:0;background:none;color:var(--text-sub);width:26px;height:26px;margin:-4px 0;border-radius:7px;flex:none;display:grid;place-items:center;padding:0;font-size:17px;line-height:1}
.snote-x:hover{color:var(--text);background:color-mix(in srgb,var(--warn) 18%,transparent)}
.lib-row .snote{flex:1 1 100%;margin:0 0 4px 68px}
/* a dismissed note leaves an ⓘ on the rows it was about; tapping it shows the note again */
.snote-i{border:0;background:none;padding:0;width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;color:var(--warn);vertical-align:middle;flex:none}
.snote-i svg{width:15px;height:15px;display:block}
.snote-i:hover{background:var(--warn-soft)}
.dsum .snote-i{margin:-2px 5px 0 -1px}
.note-pop{position:fixed;inset:auto;margin:0;max-width:min(340px,calc(100vw - 24px));padding:10px 12px;background:var(--warn-soft);color:var(--text);border:1px solid var(--warn);border-radius:10px;font-size:13px;line-height:1.45;box-shadow:0 12px 40px rgba(0,0,0,.3);z-index:60;animation:pop-in .2s ease-out}
.note-pop p+p{margin-top:6px}

/* welcome / upload */
.welcome{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:start}
@media (max-width:820px){.welcome{grid-template-columns:1fr}}
/* wide: the heading above, and "How to get your file" level with the upload box beside it, their middles lined up */
@media (min-width:821px){
  .welcome{grid-template-areas:"intro ." "drop how";row-gap:20px}
  .welcome .hero{display:contents}
  .hero-intro{grid-area:intro}
  .welcome .drop{grid-area:drop;margin-top:0;align-self:center}
  .welcome > aside{grid-area:how;align-self:center}
}
.hero h1{margin:8px 0 12px}
.eyebrow{font-size:12px;font-weight:600}
.drop{border:2px dashed var(--line);border-radius:18px;padding:28px 20px;text-align:center;background:var(--surface);transition:border-color .15s,background .15s;margin-top:20px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:40px;height:40px;color:var(--accent)}
.drop h3{margin:8px 0 4px;font-size:17px}
.drop p{color:var(--text-sub);font-size:14px}
.drop .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.private{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--text-sub);margin-top:14px}
.private svg{flex:none;width:16px;height:16px;margin-top:2px;color:var(--good)}
.steps{list-style:none;padding:0;margin:0;counter-reset:s;display:flex;flex-direction:column;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:12px}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--text);font-family:var(--font-num);font-weight:700;display:grid;place-items:center;font-size:14px}
.steps b{display:block}
.steps span{color:var(--text-sub);font-size:14px}
.progress{margin-top:16px}
.progress .bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.progress p{font-size:13px;color:var(--text-sub);margin-top:6px}
.err{color:var(--bad);font-weight:600;margin-top:12px;font-size:14px}
.foot{color:var(--text-sub);font-size:12.5px;margin-top:32px;max-width:70ch}
/* Your data. Phones: one column (upload, what's loaded, how it reads, settings). Wide: the heading, then the upload
   box and "How Pulse reads your export" on the left, and "What's loaded" and Settings on the right, each pair at its
   own height with their middles lined up while Settings and the explainer are closed: the shorter side is moved down
   by the script (placeDl). Opening either one only grows its own card downwards; the other side stays where it is.
   The note stays right under the explainer, however tall Settings grows beside it. */
.dl{display:flex;flex-direction:column;gap:16px}
.dl-left,.dl-right,.dl-lbody{display:contents}
.dl-head{order:0} .dl-up{order:1} .dl-acct{order:2} .dl-loaded{order:2} .dl-how{order:3} .dl-set{order:4} .dl-foot{order:5}
/* on Your data the note sits under "How Pulse reads your export", so opening Settings beside it doesn't push it down */
main:has(.dl) > .foot{display:none}
.dl-foot{margin-top:4px}
/* the heading sits with the upload on the left, just above it, rather than alone at the top of the page */
.dl .page-head{margin-bottom:4px}
.dl .drop{margin-top:0}
/* the cards here are spaced by the layout's gap alone (the usual space between two panels would double it) */
.dl .panel + .panel{margin-top:0}
@media (min-width:900px){

/* Opening and closing, one motion everywhere: open fades in (0 → 1) and scales up (0.95 → 1) over 200ms

   has finished.
   - dialogs: the box does it, with the dim backdrop fading alongside (the script's close() waits for it).
   - <details> panels (the "How … works" explainers, Settings, Full history): slower, opening over 500ms with an
     ease-out that settles gently at full height and closing over 250ms, the height growing and shrinking with the
     fade. Browsers that can't animate to an auto height open and close instantly.
   - sections that expand in place, drawn by the script (tag categories, Every day / As needed, "More days…"):

   sign-in controls, and stands in for window.claude, so the sync code further down runs as it is. */
const HOST = window.PULSE_HOST || null;
const ACCT = HOST ? "Pulse account" : "Claude account";
const STORE_KEY_EARLY = "pulse-health-v1" + (HOST ? HOST.ns : "");   // same value as STORE_KEY, which is defined further down
const THEME_KEY = STORE_KEY_EARLY + "-theme";
const darkMQ = window.matchMedia ? window.matchMedia("(prefers-color-scheme:dark)") : null;
const themeById = id => THEMES.find(t => t.id === id) || THEMES[0];
function applyTheme(id) {
  const t = themeById(id), d = document.documentElement;
  if (t.id) d.dataset.theme = t.id; else delete d.dataset.theme;
  // Auto leaves data-theme off, so the prefers-color-scheme block still drives it, exactly as before
  d.dataset.scheme = t.scheme || (darkMQ && darkMQ.matches ? "dark" : "light");
}
// A first-time visitor goes straight to the welcome screen, so only wait-skeleton a returning one
try { if (localStorage.getItem(STORE_KEY_EARLY)) document.documentElement.dataset.boot = "data"; } catch (e) {}
let themeId = "";
try { themeId = localStorage.getItem(THEME_KEY) || ""; } catch (e) {}
themeId = themeById(themeId).id;
applyTheme(themeId);
if (darkMQ) darkMQ.addEventListener("change", () => { if (!themeId) applyTheme(themeId); });

/* ---------- Summary ---------- */
function card(key, opts = {}) {
  const l = latest(key); if (!l) return "";
  // by today's date, not the last day in the export: an export from last week has no "yesterday". A night is dated by its morning
  const m = METRICS[key], today = keyToIdx(todayKey());
  const when = key === "sleep" ? (l[0] === today ? "Last night" : fmtDate(l[0], true)) : l[0] === today ? "Today" : l[0] === today - 1 ? "Yesterday" : fmtDate(l[0], true);
  // Sleep opens its own tab, and anything the Body tab charts opens Body; the rest open in Trends
  const go = key === "sleep" ? `data-tab="sleep"` : BODY_TAB.includes(key) ? `data-tab="body"` : `data-go="${key}"`;
  return `<button class="card" type="button" ${go}>
    <span class="label"><i style="background:var(${m.color})"></i>${esc(opts.label || m.short || m.name)}</span>
    <span class="val num">${valHTML(key, l[1])}</span>
    <span class="vs">${esc(opts.vs || usualText(key))}</span>
    <span class="when">${when}</span>
    ${spark(key, m.color)}
  </button>`;
}
/* The Summary cards: which metrics have a card, in order, and which cards are wide (two columns). The defaults are

   lives only here and is put back on exit. Any metric Trends has can go on a card, and there can be as many or as
   few as you like (at least one). */
const SUM_ORDER_KEY = STORE_KEY + "-summary-order";
// in the order of the tabs they open where one has its own (Stress, Sleep, then Body's weight), then the rest
const SUM_DEFAULT = ["stress", "sleep", "weight", "steps", "rhr", "hrv", "exercise", "active"];
// what the Body tab charts, so those cards open there
const BODY_TAB = ["weight", "fat", "lean", "bmi", "eaten", "protein", "water"];
// shorter labels where a card's small caps can't fit the full name
const CARD_LABEL = {rhr: "Resting HR", hrv: "HRV", exercise: "Exercise", active: "Active cal", basal: "Resting cal", hr: "Heart rate", hrLow: "Sleeping HR", walkHR: "Walking HR", resp: "Breathing rate", flights: "Floors", daylight: "Daylight", eaten: "Calories eaten", mindful: "Mindful min"};
let sumOrderMem = (() => { try { const v = JSON.parse(localStorage.getItem(SUM_ORDER_KEY)); if (Array.isArray(v)) return v; } catch (e) {} return null; })();
// the saved set, with anything unknown or repeated dropped; none saved (or nothing left of it) is the default
const sumOrder = () => {
  const keys = [...new Set((sumOrderMem || []).filter(k => k in METRICS))];
  return keys.length ? keys : [...SUM_DEFAULT];
};
// the wide cards: saved as a list of metrics, so a card keeps its size wherever it's moved
const SUM_WIDE_KEY = STORE_KEY + "-summary-wide", SUM_WIDE_DEFAULT = ["stress", "sleep"];
let sumWideMem = (() => { try { const v = JSON.parse(localStorage.getItem(SUM_WIDE_KEY)); if (Array.isArray(v)) return v; } catch (e) {} return null; })();

function setSumWide(ks) {
  const same = ks && [...ks].sort().join() === [...SUM_WIDE_DEFAULT].sort().join();
  sumWideMem = ks && !same ? [...ks] : null;
  if (!S.sample) try { sumWideMem ? localStorage.setItem(SUM_WIDE_KEY, JSON.stringify(sumWideMem)) : localStorage.removeItem(SUM_WIDE_KEY); } catch (e) {}
  savePrefs({sumWide: sumWideMem});
}
function setSumOrder(o) {

  savePrefs({sumOrder: sumOrderMem});
}
let sumArrange = false, sumAway = null;
const SUM_ARR_HINT = "Drag a card to move it. Tap its buttons to change, resize or remove it.";   // sumAway: the tap-outside listener of the Summary on screen, one at a time
function pageSummary(el) {
  const last = keyToIdx(S.data.last);
  const st = S.stress[S.stress.length - 1];
  const stressCard = st ? `<button class="card" type="button" data-tab="stress">
      <span class="label"><i style="background:var(${LEVEL[st.level].var})"></i>Stress</span>
      <span class="val num">${st.score}<small>/ 100</small></span>
      <span>${pill(st.level)}</span>
      <span class="vs lead-line">${st.i >= last - 1 && dataFresh() ? LEVEL[st.level].line : LEVEL[st.level].line.replace("today", "that day")}</span>
      <span class="vs lead-line why">${esc(stressWhy(st))}</span>

    </button>` : "";
  // measurements taken now and then (weight, body fat…) say how they've moved over about four weeks instead
  const cardFor = k => {
    if (k === "stress") return stressCard;

    if (m.group === "Body" && m.agg === "last" && has(k)) {

      const d = lw[1] - ago[1];
      const vs = ago === lw ? (k === "weight" ? "Log more weigh-ins to see a trend" : "Log more to see a trend") : `${d < 0 ? "Down" : d > 0 ? "Up" : "No change,"} ${fmtVal(k, Math.abs(d))} since ${fmtDate(ago[0])}`;
      return card(k, {vs, label: CARD_LABEL[k]});
    }
    return card(k, {label: CARD_LABEL[k]});
  };
  const byKey = Object.fromEntries(sumOrder().map(k => [k, cardFor(k)]));
  const keys = sumOrder().filter(k => byKey[k]);
  // each card carries its key, for arranging
  // a wide card (.lead) takes two columns, larger on a big screen; which ones are wide is yours to set (arranging)
  const wide = sumWide();
  /* a wide card for a metric tags can line up with (sleep, HRV, resting HR, stress, breathing rate) also shows the
     one or two strongest findings for it from Habits, and a tap there opens the full list. It's drawn on every one
     of those cards and shown only while the card is wide (CSS), so resizing needs no redraw */
  const findable = new Set(FIND_KEYS.map(f => f[0])), F = keys.some(k => findable.has(k)) ? tagFindings() : null;
  const findLine = k => F && findable.has(k) ? `<span class="card-find" data-find="${k}">${cardFindings(k, F)} <b class="go">· All tags →</b></span>` : "";
  const cards = keys.map(k => byKey[k].replace(/^(\s*<button class="card)"/, `$1${wide.has(k) ? " lead" : ""}" data-card="${k}"`).replace(/<\/button>\s*$/, findLine(k) + "</button>")).join("");
  el.innerHTML = `
    <div class="page-head"><div><h1>Summary</h1><p class="sub">Data through ${fmtDateLong(last)}.</p></div>
      ${keys.length ? `<button type="button" class="iconbtn tb-gear sum-gear" aria-pressed="${sumArrange}" aria-label="Arrange cards" title="Arrange cards">${GEAR}</button>` : ""}</div>
    <div id="logNudge"></div>
    ${cards ? `<div class="sec-head"><h2>Latest</h2><span class="sum-hint">${sumArrange ? SUM_ARR_HINT : "Tap a card for its full history"}</span></div>` : ""}
    <div class="grid cards${sumArrange ? " arranging" : ""}">${cards || `<p class="empty-note">No metrics found yet.</p>`}</div>
    <select class="sum-pick" hidden aria-label="Show on this card"></select>

      <div class="panel-head"><h2>This week vs last week</h2></div>
      <p class="explain">Daily averages for the last 7 full days, next to the 7 days before, for the metrics on your cards.</p>
      <div class="tbl-wrap">${weekTable()}</div>
    </div>`;
  arrangeSummary(el);
  /* wide cards side by side: their findings lines take the height of the tallest in the row (one can wrap to two
     lines), so the dividers above them line up too; again whenever the grid changes size */
  const grid = el.querySelector(".cards");
  const evenFinds = () => {
    const fs = [...grid.querySelectorAll(":scope > .card.lead .card-find")];
    fs.forEach(f => { f.style.minHeight = ""; });
    const rows = new Map();
    for (const f of fs) { const top = f.closest(".card").offsetTop; (rows.get(top) || rows.set(top, []).get(top)).push(f); }

  // yesterday's check-in, while it isn't done: one tap opens it on Habits
  const nudge = el.querySelector("#logNudge");
  mountLive(nudge, () => {
    const y = keyAdd(todayKey(), -1);
    nudge.innerHTML = tagsPending() || tgLocked() || dayRec(y).d ? "" : `<button type="button" class="log-nudge" data-log-day="${y}"><span><b>Log yesterday →</b><small>${ciDate(y)} isn't fully logged yet</small></span></button>`;
  });
}
/* Arranging: the gear turns it on and off, and so does a click anywhere but a card. While it's on a tap doesn't open a card; a card follows the
   pointer, the cards it passes slide over, and letting go puts it in its place. Arrow keys move the focused card. */

  /* arranging, each card gets its tools (size: one column or two; remove, unless it's the last one; and the dots,

  const toolsHTML = c => {

  };

/* Which way is better in the week table. +1: up is better, −1: down is better. Sleep is better when it
   moves toward 7–9 h, and weight and calories eaten follow the weight goal set on Your data. */
const WEEK_DIR = {steps: 1, active: 1, exercise: 1, hrv: 1, rhr: -1, stress: -1};
const SLEEP_BAND = [420, 540];   // 7–9 h, in minutes
const BODY_GOAL_KEY = STORE_KEY + "-body-goal";
// read once from this browser; while the sample is open a change lives only here and is put back on exit
let bodyGoalMem = (() => { try { const v = localStorage.getItem(BODY_GOAL_KEY); if (["lose", "maintain", "gain"].includes(v)) return v; } catch (e) {} return "maintain"; })();
function bodyGoal() { return bodyGoalMem; }
function setBodyGoal(v) { bodyGoalMem = v; if (!S.sample) try { localStorage.setItem(BODY_GOAL_KEY, v); } catch (e) {} savePrefs({bodyGoal: v}); }
// "good", "bad", or "" for no colour
function weekTone(k, n, p) {
  if (k === "sleep") {
    const off = v => v < SLEEP_BAND[0] ? SLEEP_BAND[0] - v : v > SLEEP_BAND[1] ? v - SLEEP_BAND[1] : 0;
    const a = off(n), b = off(p);
    if (a !== b) return a < b ? "good" : "bad";                 // toward 7–9 h, or away from it
    return a === 0 ? (n > p ? "good" : "bad") : "";              // both weeks inside 7–9 h: more is better
  }
  if (k === "weight" || k === "eaten") { const g = bodyGoal(); return g === "maintain" ? "" : (n < p) === (g === "lose") ? "good" : "bad"; }
  const d = WEEK_DIR[k]; return d ? ((n - p) * d > 0 ? "good" : "bad") : "";
}
/* Body measurements in the week table change by an amount, not a percent: a steady, healthy change in weight is
   0.5–2 lb a week, which 1% of body weight (1.6 lb at 160 lb) would mostly call "Same". The smallest change that counts,
   in the units shown (us: true for lb): weekly averages smooth out most day-to-day water swings, so about half a pound */
const WEEK_STEP = {weight: us => us ? 0.5 : 0.25, lean: us => us ? 0.5 : 0.25, fat: () => 0.5, bmi: () => 0.2};
function weekTable() {
  const a = anchorIdx();
  // the same metrics as the Summary cards, in the same order
  const rows = sumOrder().filter(k => has(k)).map(k => {
    const s = series(k), now = between(s, a - 6, a), prev = between(s, a - 13, a - 7);
    if (!now.length && !prev.length) return "";
    const n = mean(now), p = mean(prev);
    let chg = "—", tone = "";
    const step = WEEK_STEP[k];
    if (n != null && p != null && step) {
      // body measurements: the change itself, in your units, once it's past the smallest change that means anything
      const dv = toDisp(k, n) - toDisp(k, p), min = step(S.units === "us"), u = k === "fat" ? "pts" : unitOf(k);
      if (Math.abs(dv) < min) { chg = "Same"; tone = "same"; }
      else { chg = `${dv > 0 ? "▲" : "▼"} ${num(Math.abs(dv), 1)}${u ? " " + u : ""}`; tone = weekTone(k, n, p); }
    } else if (n != null && p != null && p !== 0) {
      const pct = (n - p) / Math.abs(p) * 100;
      if (Math.abs(pct) < 3) { chg = "Same"; tone = "same"; }
      else { chg = `${pct > 0 ? "▲" : "▼"} ${Math.abs(pct).toFixed(0)}%`; tone = weekTone(k, n, p); }
    }
    return `<tr><td><span class="mname"><i style="background:var(${METRICS[k].color})"></i>${esc(METRICS[k].short || METRICS[k].name)}</span></td><td class="r">${valHTML(k, n)}</td><td class="r">${valHTML(k, p)}</td><td class="r chg ${tone}">${chg}</td></tr>`;
  }).join("");
  return `<table><thead><tr><th>Metric</th><th class="r">This week</th><th class="r">Last week</th><th class="r">Change</th></tr></thead><tbody>${rows}</tbody></table>`;
}
