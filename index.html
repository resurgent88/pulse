  const arc = (s0, s1, col) => { const [x0, y0] = pt(s0), [x1, y1] = pt(s1); return `<path d="M${x0} ${y0}A${r} ${r} 0 0 1 ${x1} ${y1}" stroke="var(${col})" stroke-width="12" fill="none" stroke-linecap="butt"/>`; };
  const [nx, ny] = pt(score);
  return `<svg class="gauge" viewBox="0 0 180 112" role="img" aria-label="Stress ${score} of 100, ${LEVEL[level].label}">
    ${arc(0, 34.5, "--good")}${arc(35.5, 59.5, "--ok")}${arc(60.5, 74.5, "--warn")}${arc(75.5, 100, "--bad")}
    <circle cx="${nx}" cy="${ny}" r="9" fill="var(--surface)" stroke="var(--text)" stroke-width="3"/>
    <text x="90" y="84" text-anchor="middle" class="num" font-weight="700" font-size="36" fill="var(--text)">${score}</text>
    <text x="90" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="var(${LEVEL[level].var})">${LEVEL[level].label}</text>
  </svg>`;
}

/* ---------- Sleep ---------- */
const FLIP_I = '<svg class="flip-i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 6.5A5 5 0 0 0 3.8 4.6"/><path d="M3.5 2.2v2.6h2.6"/><path d="M3 9.5a5 5 0 0 0 9.2 1.9"/><path d="M12.5 13.8v-2.6H9.9"/></svg>';
// whether the bedtime / wake time tile has ever been flipped here (per browser; not saved while the sample is open)
const CLOCK_FLIP_KEY = STORE_KEY + "-clock-flipped";
// the same for the sleep debt tile, which flips to tonight's bedtime
const DEBT_FLIP_KEY = STORE_KEY + "-debt-flipped";
let debtFlipped = (() => { try { return localStorage.getItem(DEBT_FLIP_KEY) === "1"; } catch (e) { return false; } })();
function setDebtFlipped() { if (debtFlipped) return; debtFlipped = true; if (!S.sample) try { localStorage.setItem(DEBT_FLIP_KEY, "1"); } catch (e) {} savePrefs({debtFlipped: true}); }
let clockFlipped = (() => { try { return localStorage.getItem(CLOCK_FLIP_KEY) === "1"; } catch (e) { return false; } })();
function setClockFlipped() { if (clockFlipped) return; clockFlipped = true; if (!S.sample) try { localStorage.setItem(CLOCK_FLIP_KEY, "1"); } catch (e) {} savePrefs({clockFlipped: true}); }
const CHEV_L = '<svg viewBox="0 0 14 14" fill="none"><path d="M8.5 3L4.5 7l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHEV_R = '<svg viewBox="0 0 14 14" fill="none"><path d="M5.5 3l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function pageSleep(el) {
  const nightsAll = Object.entries(S.data.sleep).map(([k, n]) => ({i: keyToIdx(k), ...n})).sort((a, b) => a.i - b.i);
  if (!nightsAll.length) { el.innerHTML = `<div class="page-head"><h1>Sleep</h1></div><div class="panel"><p>No sleep data in this export. Turn on Sleep in the Health app, or wear an Apple Watch to bed.</p></div>`; return; }
  const ln = nightsAll[nightsAll.length - 1];
  const byI = new Map(nightsAll.map(n => [n.i, n]));
  if (S.sleepSel != null && !byI.has(S.sleepSel)) S.sleepSel = null;
  if (!S.sleepView) S.sleepView = "dur";
  const [x0, x1] = xRange(S.ranges.sleep);
  const inR = nightsAll.filter(n => n.i >= x0 && n.i <= x1);
  const avgAsleep = mean(inR.map(n => n.asleep));
  /* the average of clock times, going round the clock: 11:50 PM and 12:10 AM average to midnight, not noon. Bedtime
     and wake time both use it, so someone who wakes around midnight (or sleeps through the day) reads right */
  const circ = arr => {
    if (!arr.length) return null;
    let x = 0, y = 0;
    for (const m of arr) { const a = m / 1440 * 2 * Math.PI; x += Math.cos(a); y += Math.sin(a); }
    return (Math.atan2(y, x) / (2 * Math.PI) * 1440 + 1440) % 1440;
  };
  const avgBed = circ(inR.map(n => n.bed)), avgWake = circ(inR.map(n => n.wake));
  const unstaged = inR.filter(n => !n.stages);

  /* ---- how last night sat against the average for the range above ---- */
  const durShort = m => { const v = Math.round(Math.abs(m)); return v < 60 ? v + "m" : Math.floor(v / 60) + "h " + String(v % 60).padStart(2, "0") + "m"; };
  const clockGap = (a, b) => { let d = (a - b + 1440) % 1440; if (d > 720) d -= 1440; return d; };   // signed minutes, shortest way round
  const NEAR = 5;                                                                                   // closer than this reads as no difference
  const lenDelta = n => avgAsleep == null ? "" : Math.abs(n.asleep - avgAsleep) < NEAR ? "about average"
    : `${durShort(n.asleep - avgAsleep)} ${n.asleep > avgAsleep ? "over" : "under"} avg`;
  const clockDelta = (v, avg) => {
    if (avg == null) return "";
    const d = clockGap(v, avg);
    return Math.abs(d) < NEAR ? "about average" : `${durShort(d)} ${d < 0 ? "earlier" : "later"}`;
  };

  /* ---- card 1 ---- */
  const STAGE_ROWS = [["Deep", "deep", "--deep"], ["Core", "core", "--core"], ["REM", "rem", "--rem"], ["Awake", "awake", "--awake"]];
  const nightHTML = n => {
    const isLatest = n.i === ln.i;
    // by today's date, like the Summary card: an export from last week has no "last night"
    const title = !isLatest ? "Selected night" : n.i === keyToIdx(todayKey()) ? "Last night" : "Most recent night";
    const pos = nightsAll.indexOf(n);
    const share = n.deep + n.core + n.rem + n.awake;   // the same total the bar splits up, so the four add up to 100
    const stage = n.stages ? `<div class="stagebar" aria-hidden="true">${[["deep","--deep"],["core","--core"],["rem","--rem"],["awake","--awake"]].map(([k, c]) => n[k] ? `<div style="flex:${n[k]};background:var(${c})"></div>` : "").join("")}</div>
      <div class="legend stage-legend" style="margin-top:0">${STAGE_ROWS.map(([l, k, c]) => {
        const own = share ? Math.round(n[k] / share * 100) : null;
        return `<span><i style="background:var(${c})"></i>${l} ${durShort(n[k])}${own == null ? "" : ` · ${own}%`}</span>`;
      }).join("")}</div>` : `<p class="explain" style="margin-top:8px">${n.inBedOnly ? "Only time in bed was recorded for this night, not actual sleep." : "No sleep stages for this night."}</p>`;
    return `<div class="panel-head"><h2>${title}</h2>
        <div class="nightnav"><span class="date">${fmtDateLong(n.i)}</span>
          <button class="iconbtn" type="button" id="nPrev" aria-label="Previous night" ${pos <= 0 ? "disabled" : ""}>${CHEV_L}</button>
          <button class="iconbtn" type="button" id="nNext" aria-label="Next night" ${pos >= nightsAll.length - 1 ? "disabled" : ""}>${CHEV_R}</button>
        </div></div>
      <div class="kv" style="margin-top:12px">
        <div><span>Asleep</span><b>${fmtDur(n.asleep)}</b><small class="delta">${lenDelta(n)}</small></div>
        <div><span>Fell asleep</span><b>${fmtClock(n.bed)}</b><small class="delta">${clockDelta(n.bed, avgBed)}</small></div>
        <div><span>Woke up</span><b>${fmtClock(n.wake)}</b><small class="delta">${clockDelta(n.wake, avgWake)}</small></div>
      </div>
      ${stage}
      ${isLatest ? "" : `<p style="margin-top:12px"><button class="linkbtn" type="button" id="nBack">Back to ${ln.i === keyToIdx(todayKey()) ? "last night" : "most recent night"}</button></p>`}`;
  };

  /* ---- card 2: same numbers the debt and consistency cards used ---- */
  const debtFor = goal => {
    const days = [];
    for (let d = ln.i - 6; d <= ln.i; d++) days.push({i: d, n: byI.get(d)});
    const had = days.filter(d => d.n);
    const net = had.reduce((t, d) => t + (goal - d.n.asleep), 0);
    return {had, debt: Math.max(0, net), avg: had.length ? mean(had.map(d => d.n.asleep)) : null};
  };
  const adjBed = m => m < 720 ? m + 1440 : m;           // minutes after noon, so 11 PM and 1 AM sit next to each other
  const adjWake = (bed, wake) => { let w = wake + 1440; if (w - adjBed(bed) > 1440) w -= 1440; if (w < adjBed(bed)) w += 1440; return w; };
  const sd = a => { const m = mean(a); return Math.sqrt(mean(a.map(v => (v - m) ** 2))); };
  const recent = nightsAll.filter(n => n.i > ln.i - 14 && !n.inBedOnly);
  let cons = null;
  if (recent.length >= 5) {
    const beds = recent.map(n => adjBed(n.bed)), wakes = recent.map(n => adjWake(n.bed, n.wake));
    const sB = sd(beds), sW = sd(wakes), spread = (sB + sW) / 2;
    const score = Math.round(Math.max(0, Math.min(100, 100 - (spread - 20) * 0.625)));
    const lv = score >= 85 ? ["Very steady", "low"] : score >= 65 ? ["Fairly steady", "normal"] : score >= 40 ? ["Irregular", "elevated"] : ["Very irregular", "high"];
    cons = {score, lv, bed: mean(beds), wake: mean(wakes), sB, sW, n: recent.length};
  }
  const pm = v => "±" + (v >= 60 ? fmtDur(v).replace(" 00m", "") : Math.round(v) + "m");
  // third tile flips between the two clock times rather than spending a tile on each
  const CLOCKS = {bed: {label: "Usual bedtime", at: c => c.bed, spread: c => c.sB, other: "wake time"},
                  wake: {label: "Usual wake time", at: c => c.wake, spread: c => c.sW, other: "bedtime"}};
  const GOALS = [[420, "7h"], [450, "7½h"], [480, "8h"], [510, "8½h"], [540, "9h"]];
  const VIEWS = [["dur", "Duration"], ["time", "Timing"], ["stages", "Stages"]];

  el.innerHTML = `
    <div class="page-head"><div><h1>Sleep</h1><p class="sub">Nights are dated by the morning you woke up. Daytime naps are left out.</p></div></div>
    <div class="panel" id="nightPanel" aria-live="polite" data-grow-from=".5"></div>
    <div class="panel" style="margin-top:16px">
      <div class="panel-head"><h2>Recent nights</h2><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="font-weight:600;font-size:14px">Your goal</span>${rangeSeg("goalSeg", S.sleepGoal, GOALS, "Sleep goal")}</div></div>
      <p class="explain">Every night in the range you pick below the tiles. Tap one to open it at the top of the page.</p>
      <div class="mtiles" id="sleepTiles"></div>
      <div class="sleep-views">${rangeSeg("sleepRange", S.ranges.sleep)}${rangeSeg("sleepView", S.sleepView, VIEWS, "Chart view")}</div>
      <div class="chart" id="sleepChart"></div>
      <div class="legend" id="sleepLegend"></div>
      <details class="sleep-how how-fit"><summary>How consistency works</summary><ul>
        <li>Pulse looks at how much your bedtime and wake time move around from night to night. Less movement means a higher score.</li>
        <li>About ±20 minutes or less scores 100. ±3 hours or more scores 0.</li>
        <li>Going to bed and waking up at similar times helps you feel more rested, even on the same total sleep. Weekend sleep-ins count too.</li>
      </ul></details>
    </div>`;

  // the tilt that says the clock tile flips: on arriving here, not on a redraw for a new range, and only until it's been flipped
  let peekClock = !QUIET && !clockFlipped, peekDebt = !QUIET && !debtFlipped;
  const drawTiles = () => {
    // a tile's flip ends a moment after the tap; by then another tab may be showing, with no tiles to draw
    const box = $("#sleepTiles"); if (!box || !el.contains(box)) return;
    const d = debtFor(S.sleepGoal);
    const goalTxt = fmtDur(S.sleepGoal).replace(" 00m", "");
    const ck = CLOCKS[S.sleepClock === "wake" ? "wake" : "bed"];
    /* tonight's bedtime: your usual wake time − your goal − about 15 minutes to fall asleep, and earlier again to pay back
       some of the debt, at most half an hour a night. Left out when there aren't enough recent nights to know the wake time,
       or when the latest night is older than last night (an old export has no "tonight") */
    const bed = cons && keyToIdx(todayKey()) - ln.i <= 1 ? Math.round((cons.wake - S.sleepGoal - 15 - Math.min(30, d.debt)) / 5) * 5 : null;
    // the first tile flips between the sleep debt and tonight's bedtime, like the clock tile; with no bedtime to show it only shows the debt
    const onBed = bed != null && S.sleepDebtSide === "bed";
    box.innerHTML = `
      <button type="button" class="mtile flip${bed != null && peekDebt ? " peek" : ""}" id="debtTile" ${bed != null ? `title="Tap for ${onBed ? "sleep debt" : "tonight's bedtime"}" aria-description="Tap for ${onBed ? "sleep debt" : "tonight's bedtime"}"` : "disabled"}>${FLIP_I}${onBed
        ? `<span>Be in bed by</span><b>${fmtClock(bed)}</b><em>${d.debt ? "Tonight, to help pay back your sleep debt" : "Tonight, to keep your sleep debt at zero"}</em>`
        : `<span>Sleep debt</span><b>${d.debt ? durShort(d.debt) + " <small>behind</small>" : "None"}</b>
        <em>${keyToIdx(todayKey()) - ln.i <= 1 ? "Last 7 nights" : `7 nights to ${fmtDate(ln.i, keyToIdx(todayKey()) - ln.i > 180)}`}${d.had.length < 7 ? `, ${d.had.length} with data` : ""} · ${goalTxt} goal</em>`}</button>
      <div class="mtile"><span>Consistency</span>
        <b style="color:var(${cons ? LEVEL[cons.lv[1]].var : "--text-sub"})">${cons ? cons.score : "—"} <small>/ 100</small></b>
        <em>${cons ? `${cons.lv[0]} · last ${cons.n} nights` : "Needs 5 nights in the last 2 weeks"}</em></div>
      <button type="button" class="mtile flip${cons && peekClock ? " peek" : ""}" id="clockTile" ${cons ? `title="Tap for ${ck.other}" aria-description="Tap for ${ck.other}"` : "disabled"}>${FLIP_I}<span>${ck.label}</span>
        <b>${cons ? fmtClock(ck.at(cons)) : "—"}${cons ? ` <small>${pm(ck.spread(cons))}</small>` : ""}</b>
        <em>${cons ? `Last ${cons.n} nights` : "Not enough nights yet"}</em></button>`;
    if (cons) peekClock = peekDebt = false;
    // tapped: the tile turns over, top edge away, and comes back round showing its other side
    flipOn("clockTile", setClockFlipped, () => { S.sleepClock = S.sleepClock === "wake" ? "bed" : "wake"; });
    flipOn("debtTile", setDebtFlipped, () => { S.sleepDebtSide = S.sleepDebtSide === "bed" ? "debt" : "bed"; });
  };
  const flipOn = (id, mark, turn) => {
    const ct = $("#" + id);
    if (ct) ct.onclick = () => {
      const hadFocus = document.activeElement === ct;
      mark();
      const swap = () => {
        turn(); drawTiles();
        const n = $("#" + id); if (!n) return;
        if (hadFocus) n.focus({preventScroll: true});
        if (n.animate && !reduceMotion()) n.animate([{transform: "perspective(600px) rotateX(-90deg)"}, {transform: "perspective(600px) rotateX(0)"}], {duration: 170, easing: "ease-out"});
      };
      if (!ct.animate || reduceMotion()) { swap(); return; }
      ct.classList.remove("peek"); ct.style.pointerEvents = "none";
      let done = false; const go = () => { if (!done) { done = true; swap(); } };
      ct.animate([{transform: "perspective(600px) rotateX(0)"}, {transform: "perspective(600px) rotateX(90deg)"}], {duration: 150, easing: "ease-in", fill: "forwards"}).finished.then(go, go);
      setTimeout(go, 300);   // in case the animation never reports back
    };
  };

  /* ---- the three views, all reading the nights array built above ---- */
  const mk = k => nightsAll.filter(n => n.stages).map(n => [n.i, n[k] / 60]);
  const stagesCfg = {x: [x0, x1], height: 260, zero: true, label: "Sleep stages per night",
    series: [{pts: mk("deep"), type: "bar", stack: true, color: "--deep"}, {pts: mk("core"), type: "bar", stack: true, color: "--core"}, {pts: mk("rem"), type: "bar", stack: true, color: "--rem"}, {pts: mk("awake"), type: "bar", stack: true, color: "--awake"},
             {pts: nightsAll.filter(n => !n.stages).map(n => [n.i, n.asleep / 60]), type: "bar", stack: true, color: "--sleep", opacity: .5}],
    yFmt: (v, d) => num(v, d) + "h",
    tip: i => { const n = byI.get(i); if (!n) return "";
      const body = n.stages ? tipLine("Deep", fmtDur(n.deep), "--deep") + tipLine("Core", fmtDur(n.core), "--core") + tipLine("REM", fmtDur(n.rem), "--rem") + tipLine("Awake", fmtDur(n.awake), "--awake")
                            : `<div>${fmtDur(n.asleep)} ${n.inBedOnly ? "in bed" : "asleep"}</div>`;
      return `<b>${fmtDate(i, true)}</b>${body}`; },
    onPick: i => show(i === S.sleepSel ? null : i, true)};

  const durCfg = () => {
    const g = S.sleepGoal / 60, over = [], under = [];
    for (const n of nightsAll) (n.asleep >= S.sleepGoal ? over : under).push([n.i, n.asleep / 60]);
    return {x: [x0, x1], height: 260, zero: true, label: "Sleep per night", selected: S.sleepSel,
      series: [{pts: over, type: "bar", color: "--sleep"}, {pts: under, type: "bar", color: "--warn"},
               {pts: [[x0, g], [x1, g]], color: "--text-sub", dash: true, width: 2, gap: 1e9}],
      yFmt: (v, d) => num(v, d) + "h",
      tip: i => { const n = byI.get(i); if (!n) return "";
        const d = n.asleep - S.sleepGoal;
        return `<b>${fmtDate(i, true)}</b><div>${fmtDur(n.asleep)} ${n.inBedOnly ? "in bed" : "asleep"}</div><div style="opacity:.75">${Math.abs(d) < 1 ? "at goal" : durShort(d) + (d > 0 ? " over" : " under") + " goal"}</div>`; },
      onPick: i => show(i === S.sleepSel ? null : i, true)};
  };

  /* ---- when you slept: floating bars on a time-of-day axis ---- */
  const tcfg = {selected: S.sleepSel, draw: () => {
    const tEl = $("#sleepChart"); if (!tEl) return;
    const W = Math.max(280, tEl.clientWidth || 600), H = 260, L = 58, R = 12, T = 10, B = 26, pw = W - L - R, ph = H - T - B;
    const pts = nightsAll.filter(n => n.i >= x0 && n.i <= x1).map(n => ({i: n.i, b: adjBed(n.bed), w: adjWake(n.bed, n.wake), n}));
    if (!pts.length) { tEl.innerHTML = `<p class="empty-note">No nights in this time range.</p>`; return; }
    const lo = Math.floor((Math.min(...pts.map(p => p.b)) - 30) / 120) * 120, hi = Math.ceil((Math.max(...pts.map(p => p.w)) + 30) / 120) * 120;
    // the same half-bar margin at each end as the other bar charts
    const bw = Math.max(1.5, Math.min(18, pw / (x1 - x0 + 1) * 0.7)), inset = bw / 2 + 2, pwIn = pw - 2 * inset;
    const X = i => L + inset + (x1 === x0 ? pwIn / 2 : (i - x0) / (x1 - x0) * pwIn), Y = m => T + (m - lo) / (hi - lo) * ph;
    const step = hi - lo > 1200 ? 240 : 120;
    let g = "";
    for (let m = lo; m <= hi; m += step) g += `<line x1="${L}" x2="${W - R}" y1="${Y(m)}" y2="${Y(m)}" stroke="var(--grid)"/><text x="${L - 8}" y="${Y(m) + 4}" text-anchor="end" font-size="11" fill="var(--text-sub)" class="num">${fmtClock(m).replace(":00", "")}</text>`;
    g += xDateLabels(x0, x1, pw, X, H);
    const sel = tcfg.selected;
    if (sel != null && sel >= x0 && sel <= x1) g += `<rect x="${X(sel) - bw / 2 - 4}" y="${T}" width="${bw + 8}" height="${ph}" rx="5" fill="var(--text)" opacity=".08"/>`;
    for (const p of pts) g += `<rect x="${X(p.i) - bw / 2}" y="${Y(p.b)}" width="${bw}" height="${Math.max(2, Y(p.w) - Y(p.b))}" rx="${Math.min(3, bw / 3)}" fill="var(--sleep)" opacity="${(p.n.inBedOnly ? .45 : .9) * (sel != null && p.i !== sel ? .4 : 1)}"/>`;
    const aB = mean(pts.map(p => p.b)), aW = mean(pts.map(p => p.w));
    for (const a of [aB, aW]) g += `<line x1="${L}" x2="${W - R}" y1="${Y(a)}" y2="${Y(a)}" stroke="var(--text-sub)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    tEl.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Bedtime and wake time each night">${g}<line class="xh" x1="0" x2="0" y1="${T}" y2="${T + ph}" stroke="var(--ink-3)" visibility="hidden"/></svg><div class="tip" hidden></div>`;
    tEl.classList.add("pickable");
    const byNight = new Map(pts.map(p => [p.i, p.n]));
    chartHover(tEl, {W, H, L, T, pw, x0, x1, xs: [...byNight.keys()].sort((a, b) => a - b), at: X,
      tipFor: i => { const n = byNight.get(i); return `<b>${fmtDate(i, true)}</b><div>${fmtClock(n.bed)} → ${fmtClock(n.wake)}</div><div>${fmtDur(n.asleep)} ${n.inBedOnly ? "in bed" : "asleep"}</div>`; },
      onPick: i => show(i === S.sleepSel ? null : i, true)});
  }};

  const LEGENDS = {
    dur: () => `<span><i style="background:var(--sleep)"></i>At or over goal</span><span><i style="background:var(--warn)"></i>Under goal</span><span><i class="dash"></i>Your goal</span>`,
    time: () => `<span><i style="background:var(--sleep)"></i>Asleep</span><span><i class="dash"></i>Your average bedtime and wake time</span>`,
    stages: () => [["Deep","--deep"],["Core","--core"],["REM","--rem"],["Awake","--awake"]].map(([l, c]) => `<span><i style="background:var(${c})"></i>${l}</span>`).join("") + (unstaged.length ? `<span><i style="background:var(--sleep);opacity:.5"></i>Asleep, no stages</span>` : ""),
  };
  const drawView = () => {
    const ce = $("#sleepChart"); if (!ce) return;
    ce.classList.remove("pickable");
    chart(ce, S.sleepView === "time" ? tcfg : S.sleepView === "stages" ? stagesCfg : durCfg());
    $("#sleepLegend").innerHTML = LEGENDS[S.sleepView]();
  };
  const setSeg = (id, v) => { const g = document.getElementById(id); if (g) g.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === String(v)))); };

  const show = makeDayNav({
    get: () => S.sleepSel, set: v => { S.sleepSel = v; }, latest: ln.i, days: nightsAll.map(x => x.i), panel: () => $("#nightPanel"),
    ids: {prev: "nPrev", next: "nNext", back: "nBack"}, html: i => nightHTML(byI.get(i)), dateFor: i => fmtDateLong(i),
    render: i => { $("#nightPanel").innerHTML = nightHTML(byI.get(i) || ln); },
    after: () => { stagesCfg.selected = S.sleepSel; tcfg.selected = S.sleepSel; drawView(); }});

  drawTiles();
  show(S.sleepSel);
  bindSeg("sleepRange", v => { S.ranges.sleep = v; redrawQuietly(() => pageSleep(el)); });
  bindSeg("sleepView", v => { S.sleepView = v; setSeg("sleepView", v); drawView(); });
  bindSeg("goalSeg", v => {
    S.sleepGoal = v; setSeg("goalSeg", v);

  {key: "hrv", name: "HRV down", label: "HRV", minPct: 0.10},
  {key: "resp", name: "Breathing rate up", label: "Breathing rate", min: 0.5},

    return false;
  }
  chart(el, {draw: () => {
    if (!el.isConnected) return;
    el.classList.remove("pickable");
    const W = Math.max(280, el.clientWidth || 600), H = 200, Lm = 46, R = 12, T = 12, B = 26, pw = W - Lm - R, ph = H - T - B;
    const vs = pts.map(p => p[1]).concat(avg != null ? [avg] : []);
    let lo = Math.min(...vs), hi = Math.max(...vs); const pad = Math.max(2, (hi - lo) * 0.08); lo -= pad; hi += pad;
    const step = niceStep(hi - lo, 4); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const X = m => Lm + m / 1440 * pw, Y = v => T + ph - (v - lo) / (hi - lo) * ph;
    let g = "";
    for (let i = 0, v = lo; v <= hi + 1e-9; v = lo + ++i * step) g += `<line x1="${Lm}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${Lm - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--text-sub)" class="num">${num(v, stepDec(step))}</text>`;
    [0, 360, 720, 1080, 1440].forEach((m, k) => { g += `<text x="${X(m)}" y="${H - 6}" text-anchor="${k === 0 ? "start" : k === 4 ? "end" : "middle"}" font-size="11" fill="var(--text-sub)" class="num">${fmtClock(m).replace(":00", "")}</text>`; });
    if (avg != null) g += `<line x1="${Lm}" x2="${W - R}" y1="${Y(avg)}" y2="${Y(avg)}" stroke="var(--text-sub)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    // breaks where the watch recorded nothing for more than half an hour
    let d = "", prev = null;
    for (const [m, v] of pts) { d += (prev == null || m - prev > 30 ? "M" : "L") + X(m).toFixed(1) + " " + Y(v).toFixed(1); prev = m; }
    g += `<path d="${d}" fill="none" stroke="var(--heart)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Heart rate through ${esc(fmtDateLong(i))}">${g}<line class="xh" x1="0" x2="0" y1="${T}" y2="${T + ph}" stroke="var(--ink-3)" visibility="hidden"/><circle class="hd" r="4" fill="var(--heart)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/></svg><div class="tip" hidden></div>`;
    // a dot rides the line under the crosshair
    const hd = el.querySelector(".hd"), bpm = new Map(pts);
    chartHover(el, {W, H, L: Lm, T, pw, x0: 0, x1: 1440, xs: pts.map(p => p[0]), at: X,
      tipFor: m => `<b>${fmtClock(m)}</b><div>${num(bpm.get(m), 0)} bpm</div>`,
      onShow: (m, sx) => { hd.setAttribute("cx", sx); hd.setAttribute("cy", Y(bpm.get(m))); hd.setAttribute("visibility", "visible"); },
      onHide: () => hd.setAttribute("visibility", "hidden")});
  }});
  return true;
}

/* ---------- Body ---------- */

      const d = b[1] - a[1];
      weightSummary = `<div class="panel"><div class="kv">
        <div><span>Latest</span><b>${fmtVal("weight", b[1])}</b></div>
        <div><span>Change in range</span><b>${d > 0 ? "+" : d < 0 ? "−" : ""}${fmtVal("weight", Math.abs(d))}</b></div>
        <div><span>Per week, average</span><b>${d > 0 ? "+" : d < 0 ? "−" : ""}${fmtVal("weight", Math.abs(d) / weeks)}</b></div>
        <div><span>Weigh-ins</span><b>${inR.length}</b></div>
      </div></div>`;
    }
  }

  el.innerHTML = `<div class="page-head"><div><h1>Body</h1><p class="sub">Weight, body makeup, and anything you log from food apps.</p></div>${rangeSeg("bodyRange", S.ranges.body, [[30,"30 days"],[90,"90 days"],[180,"6 months"],[0,"All"]])}</div>
    ${weightSummary}
    ${keys.length ? `<div class="grid two" style="margin-top:16px">${keys.map(k => metricPanel(k, TXT[k], {x: xRange(S.ranges.body)})).join("")}</div>` : `<div class="panel"><p>No weight or body data yet. Log your weight in the Health app (Browse → Body Measurements → Weight → Add Data) and it'll show up here next time you upload.</p></div>`}`;
  const x = xRange(S.ranges.body);
  keys.forEach(k => drawMetric(k, x, {zero: METRICS[k].agg === "sum", sparse: ["weight", "fat", "lean", "bmi"].includes(k) && series(k).length < 90}));
  // each chart card opens up into the middle of the screen, like the heart rate one on Health Check
  keys.forEach(k => makeZoomable(document.getElementById("ch-" + k)?.closest(".panel")));

/* ---------- Trends ---------- */
function pageTrends(el) {
  const avail = Object.keys(METRICS).filter(k => has(k));
  if (!avail.includes(S.trend.metric)) S.trend.metric = avail[0];
  const groups = {};
  avail.forEach(k => (groups[METRICS[k].group] || (groups[METRICS[k].group] = [])).push(k));
  const opts = Object.entries(groups).map(([g, ks]) => `<optgroup label="${g}">${ks.map(k => `<option value="${k}" ${k === S.trend.metric ? "selected" : ""}>${esc(METRICS[k].name)}</option>`).join("")}</optgroup>`).join("");
  el.innerHTML = `<div class="page-head"><div><h1>Trends</h1><p class="sub">Look at any metric over any stretch of time.</p></div></div>
    <div class="panel">
      <div class="controls">
        <label for="tMetric" class="hide-sm" style="font-weight:600;font-size:14px">Show</label>
        <select id="tMetric">${opts}</select>
        ${rangeSeg("tRange", S.trend.range)}
        <div class="seg" role="group" aria-label="Group by" id="tGran">${[["day","Daily"],["week","Weekly"],["month","Monthly"]].map(([v,l]) => `<button type="button" data-v="${v}" aria-pressed="${S.trend.gran === v}">${l}</button>`).join("")}</div>
      </div>
      <div class="chart" id="trendChart"></div>
      <div class="legend" id="trendLegend"></div>
      <div class="stats" id="trendStats"></div>
    </div>`;
  $("#tMetric").onchange = e => { S.trend.metric = e.target.value; redrawQuietly(() => pageTrends(el)); };
  bindSeg("tRange", v => { S.trend.range = v; redrawQuietly(() => pageTrends(el)); });
  $("#tGran").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { S.trend.gran = b.dataset.v; redrawQuietly(() => pageTrends(el)); } });
  const key = S.trend.metric, m = METRICS[key], [x0, x1] = xRange(S.trend.range);
  const raw = key === "stress" ? series(key) : series(key).map(([i, v]) => [i, key === "sleep" ? v / 60 : toDisp(key, v)]);
  const inR = raw.filter(([i]) => i >= x0 && i <= x1);
  let pts = inR, label = "Daily value";
  // weeks start on Monday, months on the 1st; the first one takes in its days from before the range, so it's whole
  const bucketOf = i => { const d = new Date(i * DAY); return S.trend.gran === "week" ? i - ((d.getUTCDay() + 6) % 7) : Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) / DAY; };
  const cx0 = S.trend.gran === "day" ? x0 : bucketOf(x0);
  if (S.trend.gran !== "day") {
    const buckets = new Map();
    for (const [i, v] of raw) {
      if (i < cx0 || i > x1) continue;
      const b = bucketOf(i);
      (buckets.get(b) || buckets.set(b, []).get(b)).push(v);
    }
    pts = [...buckets].map(([b, vs]) => [b, mean(vs)]).sort((a, b) => a[0] - b[0]);
    label = m.agg === "sum" ? `Average per day, by ${S.trend.gran}` : `Average, by ${S.trend.gran}`;
  }
  const isSum = m.agg === "sum" || key === "sleep";
  const u = key === "sleep" ? "hr" : unitOf(key);
  const dec = key === "sleep" ? 1 : decOf(key);
  const avg = S.trend.gran === "day" ? rolling(inR) : [];
  const bars = isSum && (S.trend.gran !== "day" || x1 - x0 <= 120);
  const mp = new Map(pts), am = new Map(avg);
  const gname = S.trend.gran === "week" ? "Week of " : "";
  const useBand = S.trend.gran === "day" && key !== "stress";
  let ub = useBand ? usualBand(key, v => key === "sleep" ? v / 60 : toDisp(key, v)) : null;
  if (ub && !ub.band.length) ub = null;
  const bandS = ub && ub.band.length ? [{pts: ub.band, type: "band", color: m.color}] : [];
  const hi = ub ? ub.out : null;
  chart($("#trendChart"), {x: [cx0, x1], height: 260, zero: isSum, label: m.name,
    series: [...bandS, bars ? {pts, type: "bar", every: S.trend.gran === "week" ? 7 : S.trend.gran === "month" ? 30.4 : 1, color: m.color, opacity: hi ? .45 : .85, hi} : (S.trend.gran === "day" && pts.length > 40 ? {pts, type: "dots", color: m.color, r: 2.2, opacity: hi ? .3 : .5, hi} : {pts, color: m.color, gap: S.trend.gran === "day" ? 4 : 62, dotsIfFew: true, hi}),
             ...(avg.length ? [{pts: avg, color: bars ? "--text-sub" : m.color, dash: bars, width: 2.2}] : [])],
    yFmt: (v, d) => num(v, d),
    tip: i => mp.has(i) ? `<b>${S.trend.gran === "month" ? MON[new Date(i*DAY).getUTCMonth()] + " " + new Date(i*DAY).getUTCFullYear() : gname + fmtDate(i, true)}</b><div>${key === "sleep" ? fmtDur(mp.get(i) * 60) : num(mp.get(i), dec) + " " + u}</div>${ub && ub.info.has(i) ? `<div style="opacity:.75">Usual ${key === "sleep" ? fmtDur(ub.info.get(i)[0] * 60) + "–" + fmtDur(ub.info.get(i)[1] * 60) : num(ub.info.get(i)[0], dec) + "–" + num(ub.info.get(i)[1], dec) + " " + u}</div>${ub.out.has(i) ? "<div><b>Outside your usual range</b></div>" : ""}` : ""}${am.has(i) ? `<div style="opacity:.75">7-day avg ${key === "sleep" ? fmtDur(am.get(i) * 60) : num(am.get(i), dec) + " " + u}</div>` : ""}` : ""});
  $("#trendLegend").innerHTML = `<span><i style="background:var(${m.color})"></i>${label}</span>` + (avg.length ? `<span><i class="dash"></i>7-day average</span>` : "")
    + (bandS.length ? `<span><i style="background:var(${m.color});opacity:.25"></i>Your usual range (${SPARSE_BAND.has(key) ? 90 : 30} days before each day)</span><span>Brighter = outside it</span>` : "");
  const vals = inR.map(p => p[1]);
  const f = v => v == null ? "—" : key === "sleep" ? fmtDur(v * 60) : num(v, dec) + (u ? " " + u : "");
  $("#trendStats").innerHTML = vals.length ? `
    <div><span>Average</span><b>${f(mean(vals))}</b></div>
    <div><span>Lowest</span><b>${f(Math.min(...vals))}</b></div>
    <div><span>Highest</span><b>${f(Math.max(...vals))}</b></div>
    <div><span>Days with data</span><b>${vals.length.toLocaleString()}</b></div>` : "";
}

        </div>
        <div class="panel dl-set">
          <details class="more set-more how-fit" data-fit-to=".dl-set" id="setMore"${setOpen ? " open" : ""}><summary>${CHEV_R}<h2 class="set-h">${GEAR}Settings</h2></summary>
          <div class="set-rows">

            <div class="set-row"><p class="set-k">Units</p>
              <div class="seg" role="group" aria-label="Units" id="unitSeg"><button type="button" data-v="us" aria-pressed="${S.units === "us"}">lb · mi · °F</button><button type="button" data-v="metric" aria-pressed="${S.units === "metric"}">kg · km · °C</button></div></div>

  /* Two columns: each side's middle lined up with the other's, measured as they are with Settings and the explainer

     the two sides sit balanced, and opening either dropdown grows only its own card: the other side never slides

  {

    const colH = (col, cards) => cards.reduce((t, c) => t + shut(c), 0) + parseFloat(getComputedStyle(col).rowGap || 0) * (cards.length - 1);
    const placeDl = () => {
      if (!Lb.isConnected) return;
      if (!window.matchMedia("(min-width:900px)").matches) { Lb.style.marginTop = R.style.marginTop = ""; return; }

/* ---------- Explainers ----------
   Opening a "How … works" panel blurs its sentences in one by one. Only a tap or key on its summary starts it,
   so a panel that is redrawn already open (the supplement list redraws often) doesn't replay it. */
function splitSentences(li) {
  if (li.dataset.split) return [...li.querySelectorAll(".sent")];
  const out = [], nodes = [...li.childNodes];
  let cur = document.createElement("span");
  const close = () => { if (cur.textContent.trim()) out.push(cur); cur = document.createElement("span"); };
  for (const n of nodes) {
    if (n.nodeType !== 3) { cur.appendChild(n); continue; }
    const parts = n.textContent.split(/(?<=[.!?])\s+(?=\S)/);
    parts.forEach((p, j) => { cur.appendChild(document.createTextNode(p)); if (j < parts.length - 1) close(); });
  }
  close();
  li.textContent = "";
  out.forEach((sp, j) => { sp.className = "sent"; if (j) li.appendChild(document.createTextNode(" ")); li.appendChild(sp); });
  li.dataset.split = "1";
  return out;
}
const sentsOf = d => [...d.querySelectorAll(":scope > ul > li")].flatMap(splitSentences);
// the tap lands before the panel opens: hide its sentences now, so none shows before its turn
document.addEventListener("click", e => {
  const sm = e.target.closest("details > summary"), d = sm && sm.parentElement;
  if (!d || d.open || !d.querySelector(":scope > ul")) return;
  d.dataset.anim = "1";
  for (const sp of sentsOf(d)) { sp.classList.remove("go"); sp.classList.add("wait"); }
  void d.offsetWidth;   // let the browser see "go" gone, so reopening plays the animation again
});
document.addEventListener("toggle", e => {
  const d = e.target;
  if (!(d instanceof HTMLDetailsElement) || !d.dataset.anim) return;
  delete d.dataset.anim;
  const sents = sentsOf(d);
  for (const sp of sents) sp.classList.remove("wait");
  if (!d.open) return;
  /* each one as the opening reaches it: its delay is how far down it sits over the panel's pace (an explainer), or
     70ms after the one before */
  const top = (d.querySelector(":scope > summary") || d).getBoundingClientRect().bottom, dur = openDurOf.get(d);
  sents.forEach((sp, i) => { sp.style.animationDelay = (dur != null ? Math.round((sp.getBoundingClientRect().top - top) / OPEN_PACE * 1000 * 0.8) : Math.min(i * 70, 900)) + "ms"; sp.classList.add("go"); });
}, true);

/* How long an explainer takes to open: the same pace for all of them (px a second, the one "How the score works" opens
   at in half a second), so a long one takes longer instead of shooting open. Its height is measured on a hidden copy
   at the same width, since a closed panel's content isn't laid out. */
const OPEN_PACE = 400, openDurOf = new WeakMap(), openHOf = new WeakMap();
function openDur(d) {
  if (reduceMotion()) return 0;
  const m = document.createElement("div");
  m.style.cssText = `position:absolute;left:-9999px;top:0;visibility:hidden;width:${d.clientWidth}px`;
  m.className = d.className.replace(/\bhow-fit\b/, "");
  for (const c of d.children) if (c.tagName !== "SUMMARY") m.appendChild(c.cloneNode(true));
  for (const n of m.querySelectorAll("[id]")) n.removeAttribute("id");
  d.parentElement.appendChild(m); const h = m.offsetHeight; m.remove();
  const s = Math.min(2, Math.max(0.4, h / OPEN_PACE));
  openDurOf.set(d, s); openHOf.set(d, h);
  return +s.toFixed(2);
}

/* The "How …" explainers and Settings: while one opens, the page scrolls along with it, a frame at a time, just enough
   to keep all of it on screen (never so far that its title goes under the top bar), and closing it scrolls back to
   where you were before you opened it. data-fit-to names a card to bring into view instead, so what's under the
   dropdown in that card comes along (Settings and the Remove data line under it). */
document.addEventListener("click", e => {
  const sm = e.target.closest("details.how-fit > summary"), d = sm && sm.parentElement;
  if (!d) return;

document.addEventListener("toggle", e => {
  const d = e.target;

  const want = d.dataset.fit; delete d.dataset.fit;

  // a page that shrinks under a scroll cuts it short, so while the panel closes the page keeps its height for
  // the length of the move (and the browser's scroll anchoring, which would nudge the scroll too, stays off)
  const holdRoom = h => { root.style.minHeight = h + "px"; root.style.overflowAnchor = "none"; clearTimeout(d._room); d._room = setTimeout(() => { root.style.minHeight = root.style.overflowAnchor = ""; }, 700); };
  if (want === "close" && !d.open) {

    d._backTo = null; return;
  }
  if (want !== "open" || !d.open) return;
  d._backTo = null;
  const topBar = document.querySelector(".top"), ceiling = () => (topBar ? topBar.getBoundingClientRect().bottom : 0) + 12;
  // how far to scroll so all of it shows, never so far that its title goes under the top bar
  // data-fit-top: something beside it that stays in view too (the "Your data" title, while it sits next to Settings)
  const keep = d.dataset.fitTop && document.querySelector(d.dataset.fitTop);

    const sm = d.querySelector(":scope > summary"), r = (d.dataset.fitTo && d.closest(d.dataset.fitTo) || d).getBoundingClientRect(), sr = sm.getBoundingClientRect();
    // only while it's beside it (two columns); stacked above it on a phone, it's allowed to scroll away

   the library's own now and only "Omega-3" is kept here. */
const LIB_DOSE_WAS = {o3: ["2–4 softgels (1–2 g EPA + DHA) · with food", "2–4 softgels (1–2 g EPA + DHA) · with food · fish oil",
    "2–4 softgels (1,000–2,000 mg EPA + DHA) · with food · log combined EPA + DHA per softgel (check serving size on the back), not total oil weight"],

  tea: ["1 cup · as needed"], eaa: ["10 g · around training · as needed"], beet: ["1 serving · before training"], mgtaur: ["125 mg · evening"]};
const wasLibDose = (id, dose) => !!dose && (LIB_DOSE_WAS[id] || []).includes(dose);
const LIB_NAME_WAS = {o3: ["Omega-3"], algae: ["Algae omega-3 (vegan)", "Algae omega-3"], fiber: ["Fiber (psyllium)"], tea: ["Black or green tea"], eaa: ["EAAs / BCAAs"], beet: ["Beetroot / nitrate"]};
const LIB_ITEM = id => { for (const [, items] of SUPP_LIBRARY) { const it = items.find(x => x.id === id); if (it) return it; } return null; };
// a brand-new list's few basics: copies of their library rows, so their names and notes always match the library
// a library row as a list row: everything but the search aliases and the note, which only the library uses
const libRow = it => { const {aliases, note, ...row} = it; return row; };
const DEFAULT_SUPPS = ["multi", "d3", "o3"].map(id => libRow(LIB_ITEM(id)));

            <span class="box">${CHECK}</span><span class="ltext"><span>${esc(it.name)}</span><small class="dose">${amtHTML(notesInUnits(it))}${extra ? " · " + amtHTML(extra) : ""}</small>${it.note ? `<small class="lnote">${esc(it.note)}</small>` : ""}</span></button>
            ${row ? noteInfoHTML(row.id, rowNotes) : ""}<span class="muted" style="font-size:12.5px;padding-right:6px;white-space:nowrap">${on ? "On your list" : "Add"}</span>${rowNotes.filter(n => !n.dismissed).map(noteHTML).join("")}</div>`;
        }).join("");
      }
      list.innerHTML = html || `<p class="empty-note">Nothing in the library matches that. Close this and write it in yourself.</p>`;

    q.addEventListener("input", LIB.draw);
    list.addEventListener("click", e => {
      if (noteClick(e)) return;
      const mv = e.target.closest("[data-mol-open]"); if (mv) { openMolView(mv.dataset.molOpen); return; }
      const b = e.target.closest("[data-lib]"); if (!b) return;
      const it = LIB_ITEM(b.dataset.lib);
      if (it) { if (b.dataset.on === "1") { if (LIB.onRemove) LIB.onRemove(libRow(it)); } else if (LIB.onAdd) LIB.onAdd(libRow(it)); }

    closeOnBackdrop(dlg);
    mountLive(dlg, () => { if (dlg.open) LIB.draw(); });   // a closed library catches up when it opens
  }
  LIB.onAdd = onAdd; LIB.onRemove = onRemove; LIB.dlg.querySelector(".lib-q").value = ""; LIB.draw();
  showSheet(LIB.dlg);
}

/* ---- what your tags show ----
   For each tag with at least FIND_MIN days, the night after each of its days is set against the nights after your
   other logged days (days with any tag, a Done, or how you felt, but not this tag): sleep, HRV, resting heart rate,
   the stress score and breathing rate, which are all measured the night after a day. Steps, calories and exercise
   are left out: they're more often what a tag is about ("Ran") than something it changes.
   A difference is only shown when it's big enough to matter (a quarter of the usual day-to-day spread) and steady
   enough not to be chance (Welch's t of 2 or more); otherwise it says there's no clear difference yet. Days around
   a supplement change (suppChangeDays), and days you were sick (for every tag but Sick), are left out of both sides,
   so they don't swamp the rest. It says what goes together, never what causes what. */
const FIND_MIN = 5;
/* The card on Habits: which list shows (null: the first that has anything), and whether it shows all of its tags
   or only the first FIND_SHOWN. Kept while you're here, so a redraw after a tap doesn't reset it */
let findView = null, findAll = false;
const FIND_SHOWN = 6;
// metric, which way is better (+1 higher, −1 lower), its name in a finding
const FIND_KEYS = [["sleep", 1, "Sleep"], ["hrv", 1, "HRV"], ["rhr", -1, "Resting HR"], ["stress", -1, "Stress"], ["resp", -1, "Breathing rate"]];
function tagFindings() {
  if (!S.data) return {tags: [], any: false};
  const D = TGD(), change = suppChangeDays(), stressAt = new Map((S.stress || []).map(x => [idxToKey(x.i), x.score]));
  const after = (key, k1) => {
    if (key === "sleep") { const n = S.data.sleep[k1]; return n && !n.inBedOnly ? n.asleep : null; }
    if (key === "stress") return stressAt.get(k1) ?? null;
    const d = S.data.days[k1]; return d && d[key] != null ? d[key] : null;
  };
  const logged = Object.entries(D.days).filter(([, r]) => (r.t && r.t.length) || r.d || (r.f && Object.keys(r.f).length));
  const counts = {}; for (const [, r] of logged) for (const id of r.t || []) counts[id] = (counts[id] || 0) + 1;
  const stats = a => { const m = mean(a); return {n: a.length, m, v: a.length > 1 ? a.reduce((t, x) => t + (x - m) ** 2, 0) / (a.length - 1) : 0}; };
  // each logged day read once, not once per tag and metric (years of tagging made every tap slow): its tags, and
  // the night after it for every metric. Days around a supplement change are left out of both sides
  const keys = FIND_KEYS.filter(([key]) => key === "stress" || has(key));
  const pre = logged.filter(([k]) => !change.has(k)).map(([k, r]) => {
    const k1 = keyAdd(k, 1), t = new Set(r.t || []);
    return {t, sick: t.has("sick"), v: Object.fromEntries(keys.map(([key]) => [key, after(key, k1)]))};
  });
  const tags = [];
  for (const [id, c] of Object.entries(counts)) {
    const t = tagById(id); if (!t) continue;
    const rows = [];
    if (c >= FIND_MIN) for (const [key, dir, label] of keys) {
      const A = [], B = [];
      for (const d of pre) {
        if (id !== "sick" && d.sick) continue;
        const v = d.v[key]; if (v == null) continue;
        (d.t.has(id) ? A : B).push(v);
      }
      if (A.length < FIND_MIN || B.length < FIND_MIN) { rows.push({key, label, few: true}); continue; }
      const a = stats(A), b = stats(B), diff = a.m - b.m, se = Math.sqrt(a.v / a.n + b.v / b.n), sd = Math.sqrt(b.v) || 1;
      const clear = se > 0 && Math.abs(diff / se) >= 2 && Math.abs(diff) / sd >= .25;
      rows.push({key, label, diff, t: se ? Math.abs(diff / se) : 0, clear, good: diff * dir > 0, nA: a.n, nB: b.n});
    }
    tags.push({t, n: c, rows, clear: rows.filter(r => r.clear).sort((x, y) => y.t - x.t)});
  }
  tags.sort((x, y) => (y.clear.length ? 1 : 0) - (x.clear.length ? 1 : 0) || (y.clear[0]?.t || 0) - (x.clear[0]?.t || 0) || y.n - x.n);
  return {tags, any: tags.some(x => x.n >= FIND_MIN)};
}
// "34 min less", "6 ms lower", "4 points higher"
function findDiff(key, d) {
  const a = Math.abs(d);
  if (key === "sleep") return (a >= 60 ? fmtDur(a) : Math.round(a) + " min") + (d > 0 ? " more" : " less");
  const amt = key === "stress" ? `${Math.round(a)} point${Math.round(a) === 1 ? "" : "s"}` : `${num(toDisp(key, a), key === "resp" ? 1 : 0)} ${unitOf(key)}`;
  return amt + (d > 0 ? " higher" : " lower");
}
// the same, short and signed, for the chips on Habits: "Sleep +2h 26m", "HRV −7 ms", "Breathing +0.3/min"
const FIND_SHORT = {rhr: "Resting HR", resp: "Breathing"};
function findShort(key, d) {
  const a = Math.abs(d), sg = d > 0 ? "+" : "−";
  if (key === "sleep") return sg + (a >= 60 ? fmtDur(a).replace(" 00m", "") : Math.round(a) + "m");
  if (key === "stress") return sg + Math.round(a) + " pts";
  return sg + num(toDisp(key, a), key === "resp" ? 1 : 0) + (key === "resp" ? "/min" : " " + unitOf(key));
}
// a wide Summary card's line: the one or two strongest findings for its metric, or why there aren't any
function cardFindings(key, F) {
  const hits = F.tags.flatMap(x => x.clear.filter(r => r.key === key).map(r => ({...r, name: x.t.name}))).sort((a, b) => b.t - a.t).slice(0, 2);
  if (hits.length) return hits.map(h => `<span class="t-${h.good ? "good" : "bad"}">${esc(h.name)}: ${esc(findDiff(key, h.diff))}</span>`).join(" · ");
  return F.any ? "No tag lines up with this clearly yet" : "Not enough tagged days yet to spot a pattern";
}

/* ---- Habits tab ---- */
/* ---- the day's check-in ----
   Filled in the next morning for one day, from waking up to going to sleep: what happened, section by section in the
   order a day goes, two sections at a time with Next sliding on to the next two (Back and Next sit above the
   sections, so they stay put whatever a page's length), then how the day felt, then Done. It reads and writes the
   same tags as everything else, so days tagged before it came along show up filled in. Done marks the day fully
   logged: whatever isn't ticked didn't happen. Days without it count only the tags that are set. The supplements taken
   that day have a card of their own under it: the day's totals by ingredient, then each one with the times it was
   ticked. */
/* How the day felt: five buttons each, 1 to 5, worst on the left to best on the right, in red to green as the arrows on
   Summary. Stress runs the other way from how it's saved (a stress level, 5 = very stressed): its 1 is very stressed and
   its 5 calm, so the greens line up. Tapping the chosen one again clears it */
const CI_FEEL = [["e", "Energy", "Drained", "Full of energy", 1], ["m", "Mood", "Low", "Great", 1], ["s", "Stress", "Very stressed", "Calm", -1]];
const FEEL_TONE = ["bad", "warn", "mid", "ok", "good"];   // worst to best
const CI_PER_PAGE = 2;   // sections on each page of the check-in

const ciDate = k => { const i = keyToIdx(k); return DOW[new Date(i * DAY).getUTCDay()] + ", " + fmtDate(i); };
function checkIn(el, suppEl) {
  const st = {rangeFor: null, page: 0, day: null, jumpTo: null};
  const head = (title, k) => `<div class="panel-head"><h2>${title}</h2><span class="date">${ciDate(k)}</span></div>`;
  // the pager's window is as tall as the page showing, so a short page leaves no gap under it
  const fit = () => { const pg = el.querySelector(".ci-pager"), cur = pg && pg.querySelector(`.ci-page[data-p="${st.page}"]`); if (cur) pg.style.height = cur.offsetHeight + "px"; };
  /* The slide is a spring on the page position, counted in pages so a change of width doesn't matter. When the target
     changes mid-slide it keeps the speed it has, so tapping Next or → again while it's moving carries on smoothly
     instead of starting over with a lurch. The position lives here rather than in the track, so a redraw (a tag
     tapped, a save coming back from your Claude account) picks up exactly where the slide was. */
  const sl = {p: 0, v: 0, to: 0, raf: 0, t: 0};
  const place = () => { const tr = el.querySelector(".ci-track"); if (tr) tr.style.transform = `translateX(${-100 * sl.p}%)`; };
  const glide = (to, now) => {
    sl.to = to;
    if (now || reduceMotion()) { cancelAnimationFrame(sl.raf); sl.raf = 0; sl.p = to; sl.v = 0; place(); return; }
    if (sl.raf) return;
    sl.t = performance.now();
    const step = t => {
      if (!el.isConnected) { sl.raf = 0; return; }
      const dt = Math.max(0, Math.min(0.032, (t - sl.t) / 1000)), w = 14;   // critically damped: settles in about a third of a second
      sl.t = t;
      sl.v += (w * w * (sl.to - sl.p) - 2 * w * sl.v) * dt; sl.p += sl.v * dt;
      if (Math.abs(sl.to - sl.p) < 5e-4 && Math.abs(sl.v) < 1e-3) { sl.p = sl.to; sl.v = 0; sl.raf = 0; place(); return; }
      place(); sl.raf = requestAnimationFrame(step);

  };
  // was: the window's height before a redraw, which it grows or shrinks on from; now: jump there (a new day)
  const turn = (n, was, now) => {
    const pages = el.querySelectorAll(".ci-page"); if (!pages.length) return;
    st.page = Math.max(0, Math.min(pages.length - 1, n));

    place(); glide(st.page, now);

    // a chip tapped on the page that just slid away lets go of focus, so Space or Enter can't tick it unseen

    el.querySelectorAll(".ci-dot").forEach((d, i) => { d.classList.toggle("on", i === st.page); d.setAttribute("aria-current", i === st.page ? "step" : "false"); });
    el.querySelector(".ci-prev").disabled = st.page === 0;

      const tags = allTags().filter(t => t.cat === c.id && (!t.retired || r.t.includes(t.id)));
      if (!tags.length) return null;
      // the multi-day ones that are on get "More days…", as in the tag list, to tag a run of days at once
      const ranges = tags.filter(t => t.range && r.t.includes(t.id));
      const rangeUI = ranges.map(t => st.rangeFor === t.id
        ? `<div class="rangebox ci-rangebox">${esc(t.name)} every day from <input type="date" class="ci-from" value="${keyAdd(k, -2)}" max="${k}" aria-label="First day"> to <input type="date" class="ci-until" value="${k}" min="${k}" max="${todayKey()}" aria-label="Last day"> <button type="button" class="btn sm ci-apply" data-id="${esc(t.id)}">Apply</button> <span class="muted" style="font-size:12px">Up to ${RANGE_MAX} days</span></div>`
        : `<button type="button" class="linkbtn ci-range" data-id="${esc(t.id)}">More days of ${esc(t.name.toLowerCase())}…</button>`).join("");
      return {c, html: `<section class="ci-sec"><h3 class="ci-h">${c.emoji} ${esc(c.name)}</h3>
        <div class="chips">${tags.map(t => `<button type="button" class="chip" data-tag-toggle="${esc(t.id)}" data-day="${k}" aria-pressed="${r.t.includes(t.id)}">${esc(t.name)}${t.range ? ` <span class="muted">multi-day</span>` : ""}</button>`).join("")}</div>

    // a new day starts on the first page; a tag just added opens the page its section is on
    if (st.day !== k) { st.day = k; st.page = 0; st.rangeFor = null; }
    if (st.jumpTo) { const j = pages.findIndex(p => p.some(x => x.c.id === st.jumpTo)); if (j >= 0) st.page = j; st.jumpTo = null; }
    st.page = Math.min(st.page, pages.length - 1);
    const last = pages.length - 1;
    const addRow = `<div class="ci-add"><input type="text" maxlength="40" placeholder="Add your own" class="ci-name" aria-label="Custom tag name">
        <select class="ci-cat" aria-label="Section">${TAG_CATS.filter(c => c.id !== "supp").map(c => `<option value="${c.id}" ${c.id === "day" ? "selected" : ""}>${c.emoji} ${c.name}</option>`).join("")}</select>
        <button type="button" class="btn sm ci-addbtn">Add</button></div>`;

        : `<button type="button" class="btn primary ci-done">Done</button><span class="muted" style="font-size:13px">Marks the day fully logged: anything not ticked didn't happen.</span>`}</div>`;
    turn(st.page, was, !sameDay);

    }

    const k = S.habitDay, r = dayRec(k);

      el.innerHTML = wait("Check-in"); suppEl.innerHTML = wait("Supplements taken"); return;
    }

      return `<div class="ci-feel" role="group" aria-label="${label}"><span class="ci-fl">${label}</span>
        <div class="fvs">${[1, 2, 3, 4, 5].map(btn).join("")}</div>
        <span class="ci-scale"><span>${lo}</span><span>${hi}</span></span></div>`;
    }).join("");
    el.querySelector(".ci-feelsec").innerHTML = `<h3 class="ci-h">How you felt</h3>${feel}<p class="muted" style="font-size:12.5px;margin-top:10px">Tap a number again to clear it.</p>`;
    // that day's supplements, as logged: any change first (started, stopped, a new dose), then how many, and the time of each tap

    const changes = evs.slice(0, cutE).map(e => `<p class="ci-chg">${esc(suppEventText(e))}${e.type === "dose" ? `<span class="muted">${esc(doseDiff(e.c))}</span>` : ""}</p>`).join("")
      + (cutE < evs.length ? `<button type="button" class="linkbtn ci-more-chg" style="font-size:13px;margin:0 0 8px">${evs.length - cutE} more change${evs.length - cutE === 1 ? "" : "s"}</button>` : "");
    const suppRows = supps().filter(s => r.s.includes(s.id)).map(s => {
      const n = r.n[s.id], form = r.x[s.id] ? r.x[s.id].f : recipeOf(s).form, times = (r.tm[s.id] || []).map(fmtClock);
      return `<div class="ci-supp"><span class="ci-sname">${esc(s.name)}</span><span class="muted">${n != null ? amtHTML(`${fmtUnits(n)} ${pluralForm(form, n)}`) : "logged"}${times.length ? " · " + amtHTML(times.join(", ")) : ""}</span></div>`;

   Health numbers, tags, the supplement list and every check-off are invented here and

   Every time the sample opens it's a new made-up person with two years of life, drawn to be as
   uneven as a real one: colds, trips with jet lag, exam weeks, a running block and the injury
   after it, stretches where the watch sat on the charger, food logged for a month and then
   forgotten, weigh-ins in bursts, supplements started, stopped and skipped, short winter days and
   long summer ones. Some people are creatures of habit and some are all over the place, and

/* Which way the sample person's latest days go, so Health Check and Stress show each of their states: about a third of

    const f = {};
    if (tg && j < N - 1 && p(0.85)) {
      f.e = clamp(Math.round(3.2 - (short ? 1 : 0) - sv * 2.2 + (ran ? 0.3 : 0) + gauss() * 0.6), 1, 5);
      f.m = clamp(Math.round(3.4 - strain * 0.35 - sv * 1.5 + (h.goodNews ? 1 : 0) - (h.conflict ? 1.2 : 0) + (weekend || vac ? 0.4 : 0) + gauss() * 0.6), 1, 5);
      f.s = clamp(Math.round(2.1 + strain * 0.6 + (exam ? 0.8 : 0) + (E.crunch ? 1.4 : 0) + (h.conflict ? 0.8 : 0) + gauss() * 0.5), 1, 5);
    }
    // when each supplement was ticked: soon after waking, at lunch or dinner, or before bed, as its notes say
    const wake = night ? night.wake : P.alarm, bedEve = (P.bed + chrono) % 1440, tm = {};
    for (const id of sOn) {
      const dose = (byId[id].dose || "").toLowerCase(), n = Math.max(1, Math.round(cnt[id] || 1)), at = [];
      if (id === "sm-coffee") { let m = wake + uni(15, 40); for (let c = 0; c < n; c++) { at.push(m); m += uni(120, 210); } if (h.coffeePm && at[at.length - 1] < 780) at[at.length - 1] = uni(780, 960); }
      else {
        const m = /bed/.test(dose) ? bedEve - uni(30, 60) : /breakfast|morning/.test(dose) ? wake + uni(10, 50) : /lunch/.test(dose) ? uni(720, 810)
          : /dinner/.test(dose) ? uni(1110, 1200) : id === "sm-matcha" ? uni(600, 900) : wake + uni(20, 120);
        for (let c = 0; c < n; c++) at.push(m + c);
      }
      tm[id] = at.map(m => ((Math.round(m) % 1440) + 1440) % 1440);
    }
    // most checked-in days are finished off with Done; yesterday is left open, so Summary asks for it
    const done = tg && j < N - 1 && p(0.45 + 0.4 * ST.log);
    if (t.length || sOn.length || f.e) smpDays[k] = {t: [...new Set(t)], s: sOn, ...logged(sOn, cnt), ...(f.e ? {f} : {}), ...(done ? {d: true} : {}), ...(sOn.length ? {tm} : {})};
    ev[k] = h;
    prev = h;
  }

  /* made-up heart rate through the day for the most recent days, shifted so each day averages
     to that day's heart rate. Workouts land when that day's workouts did. */
  const hrIntra = {};
  for (let i = end - HR_INTRA_DAYS + 1; i <= end; i++) {
    const k = idxToKey(i), h = ev[k];
    if (!h || !h.watch || days[k].hr == null) continue;
    const n = sleep[k], nx = sleep[idxToKey(i + 1)], a = new Array(288).fill(null), sl = [], blocks = [];
    if (h.ran) blocks.push([p(0.5) ? int(76, 96) * 5 : int(204, 234) * 5, h.long ? int(90, 130) : int(25, 60), 132, 30]);
    if (h.lift) blocks.push([int(196, 240) * 5, int(40, 70), 102, 28]);
    if (h.hike) blocks.push([int(108, 132) * 5, int(150, 280), 98, 26]);
    for (let j = 0; j < 288; j++) {
      const m = j * 5;
      const inMorning = n && !n.inBedOnly && m < n.wake && (n.bed > n.wake || m >= n.bed);
      const inEvening = nx && !nx.inBedOnly && nx.bed > nx.wake && m >= nx.bed;
      if ((n && n.inBedOnly && m < n.wake) || p(0.05)) continue;              // off the wrist
      let v = inMorning || inEvening ? 53 + rnd() * 7 + h.sv * 8
        : 69 + Math.sin((m - 480) / 1440 * Math.PI * 2) * 6 + rnd() * 11 + h.sv * 9 + (p(0.03) ? uni(18, 35) : 0);
      for (const [t0, len, base, amp] of blocks) if (m >= t0 && m < t0 + len) v = base + rnd() * amp;
      a[j] = v; sl.push(v);
    }
    if (!sl.length) continue;
    const shift = days[k].hr - mean(sl);
    hrIntra[k] = a.map(v => v == null ? null : Math.round(v + shift));
  }
  // today is only part-done, the way a real morning looks
  const tk = todayKey();
  if (!smpDays[tk]) {
    const s = rows.filter(x => !isAsNeeded(x) && p(0.6)).map(x => x.id);
    if (onList("sm-coffee")) s.push("sm-coffee");
    const earlier = () => Math.max(0, nowMin() - int(20, 150));
    smpDays[tk] = {t: [], s, ...logged(s, {"sm-coffee": Math.max(1, Math.round(P.coffee))}), tm: Object.fromEntries(s.map(id => [id, [earlier()]]))};
  }
  SMP = {custom: SAMPLE_CUSTOM.map(c => ({...c})), pinned: [...SAMPLE_PINNED], supps: rows, days: smpDays, dismissed: []};
  return {days, sleep, hrIntra, exportDate: idxToKey(end + 1), first: idxToKey(start), last: idxToKey(end), records: 0, units: "us"};
}

/* ============================================================
   Boot
   ============================================================ */
loadData();
tgInit();
try { const g = +localStorage.getItem(STORE_KEY + "-goal"); if (g >= 360 && g <= 600) S.sleepGoal = g; } catch (e) {}
try { const t = localStorage.getItem(STORE_KEY + "-tab"); if (t && TABS.some(([k]) => k === t)) S.tab = t; } catch (e) {}
render();
</script>
